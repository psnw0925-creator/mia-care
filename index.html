<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia 陪伴・Mia Tarot 塔羅療癒</title>
<meta name="description" content="Mia Tarot：每日一抽、塔羅牌陣與全能量檢測；療癒服務後的陪伴與總結報告。">
<meta name="theme-color" content="#F5EEDF">
<meta name="mia-version" content="5.0.0-測試版 2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%23C4DAF3'/%3E%3Cstop offset='1' stop-color='%2356709F'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&family=Cormorant+Garamond:wght@500;600&display=swap">

/* ===== Mia 陪伴 5.0.0-測試版 2：設定只要改這一段 ===== */
window.MIA_CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbysIRy8D2qUnUsToIvLoIEew-NrcFW7TdZvHi9ZqsMSQUX-SOeNYZ0S8KTefu8HKJO2Ng/exec',   // 和網站 A 相同的 Apps Script 網址
  LINE_LOGIN_CHANNEL_ID: '2012624805',                           // 和網站 A 相同的 LINE Login Channel ID
  SITE_URL: 'https://psnw0925-creator.github.io/mia-care/',      // 這個網站（Mia 陪伴）的網址
  MAIN_URL: 'https://psnw0925-creator.github.io/mia-booking/',   // 網站 A（Mia 預約）的網址
  LINE_OA_ID: '@923uxnos'                                        // 官方帳號 ID
};
</script>
<style>
:root{
  color-scheme: light;
  --bg1:#F5EEDF; --bg2:#F1EFE9; --bg3:#DCE8F6;
  --paper:#FBF7EE; --paper2:#F7F3EA; --line:#E2D6BF; --line2:#D8C9AC;
  --brown:#5A4632; --brown2:#7A5A36; --ink:#33384F; --muted:#7D7466; --soft:#9C8F79;
  --gold:#C9A35A; --gold2:#E8C99A;
  --blue:#1F3D78; --blue2:#2C5598; --sky:#DCE8F6; --line-green:#06C755;
  --ok:#3F7A5A; --bad:#A4473B;
  --r:14px; --r-lg:20px; --sh:0 1px 2px rgba(90,70,50,.06),0 8px 24px -12px rgba(90,70,50,.22);
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',system-ui,sans-serif; --lat:'Cormorant Garamond',serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.7;min-height:100vh;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 100%) fixed;background-color:var(--bg2)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:radial-gradient(rgba(122,90,54,.07) 1px,transparent 1.2px);background-size:5px 5px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lat{font-family:var(--lat);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:880px}
main{flex:1;padding-bottom:40px}

/* header */
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(245,238,223,.78);border-bottom:1px solid rgba(216,201,172,.6)}
.hd .wrap{display:flex;align-items:center;gap:10px;height:56px;max-width:880px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brown)}
.logo b{font-family:var(--lat);font-size:23px;font-weight:600;line-height:1}
.logo small{font-size:11px;color:var(--soft);letter-spacing:.12em;margin-top:3px}
.pearl{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff 0 14%,#C4DAF3 45%,#56709F 100%);box-shadow:0 0 12px rgba(196,218,243,.9),inset -2px -3px 6px rgba(31,61,120,.25)}
.hd nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.hd nav a{font-size:13.5px;text-decoration:none;color:var(--brown2);padding:6px 9px;border-radius:999px}
.hd nav a.on{background:rgba(201,163,90,.16);color:var(--brown)}
.av{width:32px;height:32px;border-radius:50%;background:var(--paper);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);color:var(--brown);font-size:14px;overflow:hidden;margin-left:4px}
.av img{width:100%;height:100%;object-fit:cover}
@media(max-width:420px){.hd nav a.hide-s{display:none}.logo small{display:none}}

/* type */
.eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--gold);font-weight:500}
h1,h2,h3{font-family:var(--serif);color:var(--brown);font-weight:600;line-height:1.4}
.h1{font-size:24px}
.h2{font-size:18px}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.c{text-align:center}
.top{padding-top:22px}
.back{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--brown2);text-decoration:none;margin:14px 0 4px -4px;padding:4px}
.back svg{width:18px;height:18px}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px}
.card+.card,.blk+.blk{margin-top:14px}
.blk{margin-top:16px}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--gold)}
.note.box{background:rgba(251,247,238,.7);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(201,163,90,.15);color:var(--brown2);white-space:nowrap}
.chip.blue{background:rgba(31,61,120,.09);color:var(--blue)}
.chip.ok{background:rgba(63,122,90,.12);color:var(--ok)}
.chip.new{background:var(--gold);color:#fff;font-size:10.5px;letter-spacing:.06em;padding:1px 7px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;text-decoration:none;transition:transform .15s,box-shadow .15s,opacity .15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 8px 18px -10px rgba(31,61,120,.8)}
.btn.sec{background:var(--paper);border-color:var(--line2);color:var(--brown)}
.btn.ghost{color:var(--brown2)}
.btn.line{background:var(--line-green);color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.tlink{color:var(--blue);font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.tlink svg{width:16px;height:16px}

/* tarot card */
.tc{position:relative;aspect-ratio:480/820;perspective:900px;width:100%}
.tc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.tc.on .in{transform:rotateY(180deg)}
.tc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7%/4.2%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 2px rgba(60,40,20,.15),0 8px 18px -10px rgba(60,40,20,.5);background:#efe6d3}
.tc .fr{transform:rotateY(180deg)}
.tc.flat .in{transition:none}
button.tc{display:block;padding:0}
button.tc:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}

/* home */
.hero{padding:26px 0 6px;text-align:center}
.hero h1{font-family:var(--lat);font-size:42px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.hero p{color:var(--muted);font-size:14px;margin-top:6px}
.daily{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.daily .tc{width:118px}
.daily .eyebrow{letter-spacing:.08em;font-size:11px}
.daily h2{font-size:17px;margin:4px 0 2px}
.daily p{font-size:14px;color:var(--ink)}
.daily .heal{font-size:13px;color:var(--brown2);margin-top:6px}
.daily .done{font-size:12.5px;color:var(--soft);margin-top:8px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mi{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:rgba(251,247,238,.85);border:1px solid var(--line);text-decoration:none;color:var(--brown)}
.mi svg{width:20px;height:20px;color:var(--gold);flex:none}
.mi b{font-weight:500;font-size:14.5px}
.fe-cta{display:flex;align-items:center;gap:14px;text-decoration:none;background:linear-gradient(135deg,#FBF7EE 0%,#E9EEF6 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-top:12px}
.fe-cta .orb{width:48px;height:48px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#E8C99A 40%,#2C5598 100%);box-shadow:0 0 18px rgba(201,163,90,.5)}
.fe-cta b{display:block;font-family:var(--serif);color:var(--brown);font-size:16px}
.fe-cta small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.fe-cta svg{width:18px;height:18px;margin-left:auto;color:var(--brown2);flex:none}

/* ask */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:rgba(251,247,238,.9);font-size:14px;color:var(--brown)}
.pick.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lbl{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--brown);margin:18px 0 8px}
.lbl small{font-weight:400;color:var(--soft)}
.ta{position:relative}
.ta textarea,.inp{width:100%;border:1px solid var(--line2);background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.6;resize:none;outline:none}
.ta textarea:focus,.inp:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(44,85,152,.12)}
.ta .cnt{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--soft)}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex button{font-size:12.5px;color:var(--brown2);background:rgba(201,163,90,.1);border-radius:999px;padding:3px 10px}
.hint{font-size:12.5px;color:var(--soft);margin-top:6px}
.err{font-size:13px;color:var(--bad);margin-top:6px}

/* spread list */
.ctx{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.sp-h{font-size:13px;color:var(--soft);letter-spacing:.12em;margin:20px 0 8px}
.sp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(251,247,238,.9);margin-bottom:8px}
.sp .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center}
.sp.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.sp.on .rd{border-color:var(--blue)}
.sp.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.sp b{display:block;font-weight:500;color:var(--brown);font-size:15px}
.sp small{color:var(--muted);font-size:12.5px}
.sp .mini{margin-left:auto;display:flex;gap:3px;flex:none}
.sp .mini i{width:12px;height:20px;border-radius:2px;background:linear-gradient(160deg,#E9DFC8,#D8C9AC);display:block}
.sp.used{opacity:.62}
.sp-ab{padding:4px 2px 12px 46px;display:grid;gap:8px}
.sp-ab label{font-size:13px;color:var(--brown2)}
.sp.fe{background:linear-gradient(135deg,#FBF7EE,#E9EEF6)}

/* draw */
.slots{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.slot{width:62px;text-align:center}
.slot .ph{aspect-ratio:480/820;border-radius:6px;border:1.5px dashed var(--line2);background:rgba(251,247,238,.6);position:relative;overflow:hidden}
.slot .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:drop .45s ease-out}
.slot small{display:block;font-size:12px;color:var(--brown2);margin-top:4px;line-height:1.3}
@keyframes drop{from{transform:translateY(-30px) scale(1.1);opacity:0}to{transform:none;opacity:1}}
.slots.n5 .slot{width:52px}
.stage{position:relative;height:300px;margin:6px auto 0;max-width:520px;user-select:none;-webkit-user-select:none;touch-action:none}
.deck{position:absolute;left:50%;top:44%;width:86px;height:147px;margin:-73px 0 0 -43px;cursor:grab}
.deck img{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;object-fit:cover;box-shadow:0 2px 8px -2px rgba(60,40,20,.35);transition:transform .22s ease-out}
.deck.mix{cursor:grabbing}
.deck-hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:13px;color:var(--muted)}
.fan{position:absolute;left:50%;top:30px;width:0;height:0}
.fan button{position:absolute;left:-26px;top:0;width:52px;height:89px;transform-origin:50% 260%;transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .3s}
.fan button img{width:100%;height:100%;object-fit:cover;border-radius:5px;box-shadow:0 2px 6px -2px rgba(60,40,20,.4)}
.fan button:hover img,.fan button:focus-visible img{outline:2px solid var(--gold);outline-offset:1px}
.fan button.pk{opacity:0;pointer-events:none}
@media(min-width:600px){.fan button{left:-30px;width:60px;height:103px}.stage{height:330px}}
.draw-acts{display:flex;justify-content:center;gap:10px;margin-top:4px}
.busy{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 0;color:var(--muted);font-size:14px}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result */
.res{display:grid;gap:12px;justify-content:center;margin:18px auto 6px}
.res.n1{grid-template-columns:min(46vw,200px)}
.res.n3{grid-template-columns:repeat(3,minmax(0,150px))}
.res.n5{grid-template-columns:repeat(2,minmax(0,124px))}
.res.n5 .pos:first-child{grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
.pos{text-align:center}
.pos .pl{font-family:var(--serif);color:var(--brown);font-size:14px;margin-bottom:6px}
.pos .pl small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);line-height:1.35;min-height:2.7em}
.res.n1 .pos .pl small,.res.n5 .pos .pl small{min-height:1.35em}
.pos .cn{font-size:13px;color:var(--brown2);margin-top:6px;min-height:1.6em;transition:opacity .4s}
.pos .cn b{font-weight:500}
.pos:not(.open) .cn{opacity:0}
.res-tip{text-align:center;font-size:12.5px;color:var(--soft)}
.overall{background:linear-gradient(160deg,#FBF7EE 0%,#F1EFE9 60%,#E6EDF7 100%)}
.overall h2{display:flex;align-items:center;gap:6px}
.overall h2 svg{width:18px;height:18px;color:var(--gold)}
.overall p{margin-top:8px;line-height:1.85}
.overall .gen{font-size:12px;color:var(--soft);margin-top:10px}
.rd-item{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-top:1px dashed var(--line2)}
.rd-item:first-of-type{border-top:0;padding-top:4px}
.rd-item .tc{width:64px}
.rd-item h3{font-size:15px}
.rd-item h3 small{font-family:var(--sans);font-weight:400;color:var(--soft);font-size:12.5px;margin-left:6px}
.rd-item .kw{font-size:12.5px;color:var(--gold);margin-bottom:4px}
.rd-item p{font-size:14.5px;line-height:1.8}
.heal{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;color:var(--brown2);background:rgba(232,201,154,.18);border-radius:10px;padding:7px 10px;margin-top:8px;line-height:1.6}
.heal svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--gold)}
.disc{font-size:12px;color:var(--soft);text-align:center;margin-top:14px;line-height:1.6}
.cta{background:linear-gradient(170deg,#2C5598 0%,#1F3D78 70%,#1A3366 100%);color:#EAF1FB;border:0;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#C4DAF3 40%,rgba(86,112,159,.0) 72%);opacity:.55}
.cta h2{color:#fff;font-size:19px;position:relative;z-index:1}
.cta p{font-size:14px;color:#D6E2F4;margin-top:6px;position:relative;z-index:1}
.cta .plan{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin:14px 0;position:relative;z-index:1}
.cta .plan b{color:#fff;font-weight:500}
.cta .plan small{display:block;color:#C3D3EA;font-size:12.5px}
.cta .price{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.cta .price s{color:#9FB4D6;font-size:13px}
.cta .price strong{font-size:22px;color:#fff;font-weight:600}
.cta .btn.wht{background:#fff;color:var(--blue);position:relative;z-index:1}
.cta .tlink{color:#fff}

/* records */
.rec{display:flex;gap:12px;align-items:center;text-decoration:none;padding:14px;border-radius:16px;background:rgba(251,247,238,.9);border:1px solid var(--line);margin-bottom:10px}
.rec .th{display:flex;flex:none}
.rec .th img{width:26px;height:44px;object-fit:cover;border-radius:3px;box-shadow:0 1px 3px rgba(60,40,20,.3)}
.rec .th img+img{margin-left:-10px}
.rec b{display:block;color:var(--brown);font-weight:500;font-size:14.5px;line-height:1.45}
.rec small{color:var(--muted);font-size:12.5px;display:block}
.rec .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rec .r svg{width:16px;height:16px;color:var(--soft)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .pearl{width:44px;height:44px;margin:0 auto 12px}

/* encyclopedia */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 10px;margin-top:8px}
.cg a{text-decoration:none;text-align:center;font-size:12.5px;color:var(--brown)}
.cg a img{width:100%;aspect-ratio:480/820;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px -4px rgba(60,40,20,.45);margin-bottom:5px;background:#efe6d3}
.cd{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start;margin-top:10px}
.cd .tc{width:150px}
.cd h1{font-size:24px}
@media(max-width:520px){.cd{grid-template-columns:1fr;justify-items:center;text-align:center}.cd .tc{width:170px}}
.kv dt{font-size:13px;color:var(--gold);font-weight:500;margin-top:12px}
.kv dd{font-size:14.5px;line-height:1.8}

/* full energy */
.fe-intro{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);margin-top:14px}
.fe-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px;filter:blur(2.5px);opacity:.5}
.fe-bg img{border-radius:4px;aspect-ratio:480/820;object-fit:cover}

.ok-ico{width:56px;height:56px;border-radius:50%;background:rgba(63,122,90,.12);color:var(--ok);display:grid;place-items:center;margin:4px auto 10px}

.parts{display:flex;gap:6px;margin-top:12px}

.parts button small{opacity:.8;margin-left:4px}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 8px}
.prog .bar{flex:1;height:5px;border-radius:9px;background:rgba(216,201,172,.5);margin:0 10px;overflow:hidden}

.cells{display:grid;gap:10px}
.cell{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(251,247,238,.92);border:1px solid var(--line)}

.cell .cs{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;align-items:end}
.cell .cs .w{position:relative}
.cell .cs .nm{font-size:11px;color:var(--brown2);text-align:center;margin-top:3px;line-height:1.3;min-height:1.3em}

.rep{position:absolute;top:-6px;left:-4px;z-index:2;font-size:10px;background:var(--gold);color:#fff;border-radius:999px;padding:0 6px;line-height:1.6}
.cell .go{grid-column:1/-1}

.steps-v{list-style:none;display:grid;gap:12px;margin-top:6px}
.steps-v li{display:flex;gap:12px;align-items:flex-start}

.steps-v small{color:var(--muted);font-size:12.5px}
.mia-rd h3{font-size:15px;margin-top:14px}
.mia-rd p{white-space:pre-wrap;font-size:14.5px;line-height:1.85;margin-top:4px}

/* login gate */

.gate p{color:var(--muted);font-size:14px;margin:6px 0 18px}

/* footer */

/* modal / toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(40,32,22,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
.modal{background:var(--paper);border-radius:var(--r-lg);width:min(420px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 50px -20px rgba(40,30,20,.6);padding:20px}

.modal .btns{margin-top:16px;justify-content:flex-end}
@keyframes fi{from{opacity:0}}
#toasts{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:#3A3328;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);animation:fi .2s}
.toast.err{background:var(--bad)}
.demo-pick{display:grid;gap:8px;margin-top:12px}
.demo-pick button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff}
.demo-pick .av{margin:0}
.demo-pick small{display:block;color:var(--muted);font-size:12.5px}
.demo-tag{font-size:11px;background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap}
.limit{border-color:var(--gold2);background:#FBF3E4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cell .lb.long{font-size:14px}
@media(max-width:420px){.logo small{display:none}}
.heal-sum{background:linear-gradient(160deg,#FBF3E4,#FBF7EE)}

.heal-sum h2 svg{width:18px;height:18px;color:var(--gold)}
.heal-sum p{margin-top:8px;line-height:1.9;color:var(--brown)}

/* ===== 網站 B「Mia 陪伴」 ===== */

.hd nav a,.logo b{white-space:nowrap}

<script>
/* 牌義初稿（後台「塔羅 › 牌義內容」可逐張修改，修改會覆蓋這裡的文字） */
const TAROT_CARDS = [{"id":"m00","n":"愚者","kw":"全新的開始","core":"放下包袱，帶著好奇心踏出第一步。","love":"在感情裡，你正站在一個新的起點，心是打開的，願意不帶預設地去認識一個人或一段關係","work":"在工作上，有一個新的方向在召喚你，你願意嘗試沒做過的事，也還沒被框架限制住","money":"在金錢上，你對錢的態度比較隨性、跟著感覺走，新的收入可能性正在出現，但也容易少了規劃","people":"在人際上，你帶著真誠和天真與人相處，容易認識新朋友，也願意先相信別人","self":"在自我成長上，你正準備開始一段新的旅程，願意放下過去的身分，重新認識自己","other":"這件事正處在剛開始的階段，充滿可能性，也還有很多未知","block":"你想跳得太快，還沒看清腳下的路，或是害怕一旦踏出去就回不了頭","adv":"先別想太多，允許自己用新手的心情試試看，邊走邊調整就好","heal":"不知道答案也沒關係，好奇本身就是一種勇氣。"},
{"id":"m01","n":"魔術師","kw":"開始創造","core":"你手上已經有需要的資源，是時候把想法變成行動。","love":"在感情裡，你有能力主動表達、創造互動，關係的走向有很大一部分掌握在你手上","work":"在工作上，你的能力、資源和時機都已經到位，適合主動提案、開始執行","money":"在金錢上，你有把想法變成收入的能力，只要願意開始，資源會被你整合起來","people":"在人際上，你很會溝通與連結，能讓身邊的人看見你的想法","self":"在自我成長上，你開始意識到自己的力量，知道很多事情可以由自己決定","other":"事情的關鍵在你的行動，條件已經足夠，只差你開始","block":"你懷疑自己不夠好、資源不夠，所以一直準備卻沒有真正開始；或是用太多技巧，少了真心","adv":"把手上已經有的東西列出來，從其中一樣開始動手","heal":"你不需要等到完美才開始，你已經足夠。"},
{"id":"m02","n":"女祭司","kw":"內在的知道","core":"安靜下來，答案其實已經在你心裡。","love":"在感情裡，你需要更多時間觀察和感受，有些話還沒說出口，心裡其實已經有感覺","work":"在工作上，現在適合觀察、學習與沉澱，不急著表態，你的直覺會告訴你方向","money":"在金錢上，與其聽很多建議，不如回頭聽聽自己真正的需要，先不急著做大決定","people":"在人際上，你習慣把感受放在心裡，看得很清楚，但不一定說出來","self":"在自我成長上，你正在向內探索，直覺與夢境都在給你訊息","other":"這件事還有一些尚未揭露的部分，需要時間和安靜才能看清","block":"你知道答案，卻一直不願意相信自己；或是把自己關起來，不讓別人靠近","adv":"給自己一段安靜的時間，寫下心裡最先浮現的那個答案","heal":"你的感覺是真的，值得被你自己相信。"},
{"id":"m03","n":"皇后","kw":"豐盛與滋養","core":"讓自己被照顧，豐盛會從被滋養的地方長出來。","love":"在感情裡，關係是溫暖而有安全感的，你願意付出照顧，也能享受被愛","work":"在工作上，你的成果正在慢慢長出來，適合用溫和穩定的方式經營，讓事情自然成熟","money":"在金錢上，有豐盛和穩定的能量，你懂得享受，也能讓資源慢慢累積","people":"在人際上，你是讓人感到舒服、被包容的存在，身邊的人願意靠近你","self":"在自我成長上，你正在學習好好照顧自己的身體與感受，允許自己享受","other":"這件事有機會開花結果，需要的是耐心與持續的灌溉","block":"你一直照顧別人卻忘了自己，或是用付出來換取被需要的感覺","adv":"先照顧好自己的身體和心情，好好吃一頓飯、睡一場好覺","heal":"你值得被溫柔對待，也包括被自己溫柔對待。"},

{"id":"c09","n":"聖杯 9","kw":"心願達成","core":"願望正在實現，好好享受你得到的滿足。","love":"在感情裡，你感到滿足和幸福，願望有機會成真","work":"在工作上，你達成了想要的目標，對成果感到滿意","money":"在金錢上，物質上有滿足感，你可以好好享受努力的成果","people":"在人際上，你過得開心，也願意分享自己的快樂","self":"在自我成長上，你對自己感到滿意，懂得享受生活的美好","other":"這件事會有讓你滿意的結果，是許願成真的牌","block":"你得到了想要的，卻仍覺得少了什麼，或只是表面上的滿足","adv":"許一個具體的願望，並為它做一件事","heal":"你可以理直氣壯地享受你的幸福。"},
{"id":"c10","n":"聖杯 10","kw":"幸福圓滿","core":"心裡的家被填滿，愛在身邊流動。","love":"在感情裡，關係和諧幸福，有走向長久、組成家庭的可能","work":"在工作上，工作和生活達到平衡，團隊像家人一樣互相支持","money":"在金錢上，經濟狀況讓你感到安心，可以照顧到家人","people":"在人際上，你被愛包圍，家人與朋友的關係溫暖和睦","self":"在自我成長上，你找到了內心的平靜與歸屬感","other":"這件事會有圓滿幸福的結果，情感上很滿足","block":"你太想維持完美的表象，把真實的感受藏起來","adv":"花時間陪伴你愛的人，好好感受當下的幸福","heal":"幸福不用很大，此刻的溫暖就是。"},

/* 整體訊息：依大牌比例、主要元素、牌陣的位置流動組合 */

    const ma = [cards[1], cards[3]].filter(c => c.id[0] === 'm').length, mb = [cards[2], cards[4]].filter(c => c.id[0] === 'm').length;
    if (ma !== mb) parts.push(`「${ma > mb ? a : b}」這條路出現較多大牌，代表它會帶來更深的轉變與課題。`);

  get() { let s = null; try { s = JSON.parse(U.ls.get(this.key) || 'null'); } catch (e) { } if (s && s.expiresAt && s.expiresAt < U.iso()) { this.clear(); return null; } return s; },
  set(s) { U.ls.set(this.key, JSON.stringify(s)); },

  token() { const s = this.get(); return s ? s.token : ''; },
  user() { const s = this.get(); return s ? s.user : null; }
};
const api = {
  async call(action, data) {
    const token = Session.token();
    try {
      if (IS_DEMO) return await MOCK.call(action, data, token);
      const res = await fetch(CFG.GAS_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action, token, data: data || {} }) });
      const j = await res.json();
      if (!j.ok) throw new ApiError(j.error && j.error.code || 'INTERNAL', j.error && j.error.message, j.error && j.error.data);
      return j.data;
    } catch (e) {
      if (!(e instanceof ApiError)) e = new ApiError('INTERNAL', '無法連線，請稍後再試');
      if (['AUTH_EXPIRED', 'AUTH_INVALID', 'AUTH_REQUIRED'].includes(e.code)) { Session.clear(); }
      throw e;
    }
  }
};

function toast(msg, kind) {
  let h = $('#toasts'); if (!h) { h = document.createElement('div'); h.id = 'toasts'; document.body.appendChild(h); }
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.setAttribute('role', 'status'); t.textContent = msg;
  h.appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 4200 : 2600);
}
const errToast = e => toast(e && e.message || '發生錯誤', 'err');
function modal(o) {
  return new Promise(res => {
    const sc = document.createElement('div'); sc.className = 'scrim';
    sc.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}"><h3>${esc(o.title || '')}</h3><div>${o.html || ''}</div>${o.ok || o.cancel !== false ? `<div class="btns">${o.cancel === false ? '' : `<button class="btn ghost sm" data-x>${esc(o.cancel || '返回')}</button>`}${o.ok ? `<button class="btn pri sm" data-ok>${esc(o.ok)}</button>` : ''}</div>` : ''}</div>`;
    document.body.appendChild(sc);
    const close = v => { sc.remove(); document.removeEventListener('keydown', kd); res(v); };
    const kd = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', kd);
    sc.addEventListener('click', e => { if (e.target === sc || e.target.closest('[data-x]')) close(null); else if (e.target.closest('[data-ok]')) close(true); });
    if (o.onOpen) o.onOpen(sc, close);
  });
}
function copyText(t, msg) {
  const done = () => toast(msg || '已複製', 'ok');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('無法複製，請手動選取文字', 'err'); } ta.remove(); };
  try { navigator.clipboard.writeText(t).then(done, fb); } catch (e) { fb(); }
}

/* ---- LINE 登入 ---- */
const LineAuth = {
  redirectUri() { return CFG.SITE_URL || (location.origin + location.pathname); },
  start(returnHash) {
    const state = U.rid(12), nonce = U.rid(12);
    U.ss.set('mia.tarot.oauth', JSON.stringify({ state, nonce, returnHash: returnHash || location.hash || '#/' }));
    const p = new URLSearchParams({ response_type: 'code', client_id: CFG.LINE_LOGIN_CHANNEL_ID, redirect_uri: this.redirectUri(), state, scope: 'openid profile', nonce, bot_prompt: 'aggressive' });
    location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + p.toString();
  },
  async handleReturn() {
    const qs = new URLSearchParams(location.search);
    if (!qs.get('code') && !qs.get('error')) return false;
    let st = {}; try { st = JSON.parse(U.ss.get('mia.tarot.oauth') || '{}'); } catch (e) { }
    U.ss.del('mia.tarot.oauth');
    const clean = () => history.replaceState(null, '', location.pathname + (st.returnHash || '#/'));
    if (qs.get('error') || qs.get('state') !== st.state) { clean(); toast('LINE 登入未完成，請再試一次', 'err'); return true; }
    try {
      const r = await api.call('authLineExchange', { code: qs.get('code'), redirectUri: this.redirectUri(), nonce: st.nonce, area: 'front', from: 'tarot' });
      Session.set({ token: r.token, user: r.user, expiresAt: r.expiresAt });
    } catch (e) { errToast(e); }
    clean(); return true;
  }
};
function login(returnHash) {

      const startMix = e => { e.preventDefault(); if (phase !== 'shuffle') return; deck.classList.add('mix'); mix(); clearInterval(timer); timer = setInterval(mix, 230); hint.textContent = '洗牌中…放開就會收牌'; };
      const stopMix = () => { if (!timer) return; clearInterval(timer); timer = null; deck.classList.remove('mix'); gather(); hint.textContent = mixed ? '可以繼續洗，或展開牌開始抽' : '按住牌堆洗牌，心裡想著你的問題'; };

    } else {
      body = `<div class="tf-h"><h1 class="h1">請轉帳</h1><span class="chip">${reported ? '修改末五碼' : '待付款'}</span></div>
        ${returned ? `<p class="note box blk">${ic('warn')}<span>Mia 沒有查到末五碼 <b class="num">${esc(o.payRef)}</b> 的款項，請確認轉帳是否完成、末五碼是否正確，再重新填寫。</span></p>` : ''}
        ${info}${form}<p class="hint c">晚一點轉帳也沒關係，LINE「轉帳待付款」通知的按鈕會回到這一頁。</p>`;
    }
    App.mount(`<div class="wrap top">${body}</div>`, '', r => {
      $$('[data-cp]', r).forEach(b => b.addEventListener('click', () => copyText(b.dataset.cp, '已複製')));
      const ed = $('[data-edit]', r); if (ed) ed.addEventListener('click', () => Pages.fullTransfer(o, true));
      const cc = $('[data-cancel]', r); if (cc) cc.addEventListener('click', () => Pages.fullTransfer(o));
      const inp = $('#ref5', r); if (inp) inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 5); });
      const send = $('[data-ref]', r); if (send) send.addEventListener('click', async () => {
        const v = inp.value.trim(), er = $('[data-err]', r);
        if (!/^\d{5}$/.test(v)) { er.textContent = '請填 5 位數字'; er.hidden = false; inp.focus(); return; }
        send.disabled = true; er.hidden = true;
        try { const x = await api.call('reportTarotPayment', { orderId: o.orderId, ref: v }); toast('已回報，等 Mia 確認', 'ok'); Pages.fullTransfer(x.order); }
        catch (e) { er.textContent = e.message; er.hidden = false; send.disabled = false; if (e.code === 'PAY_NOT_PENDING') setTimeout(() => Pages.fullOrder(o.orderId), 1200); }
      });
      const dk = $('[data-demook]', r); if (dk) dk.addEventListener('click', async () => { await api.call('tarotDemoConfirm', { orderId: o.orderId, ok: true }); Pages.fullOrder(o.orderId); });
      const dn = $('[data-demono]', r); if (dn) dn.addEventListener('click', async () => { await api.call('tarotDemoConfirm', { orderId: o.orderId, ok: false }); Pages.fullOrder(o.orderId); });
    });
  },

  /* ---------- 全能量檢測：一格一格抽 ---------- */
  async full(id) {
    if (!Session.user()) return App.gate();
    App.busy('');
    let rd; try { rd = (await api.call('tarotGetReading', { readingId: id })).reading; } catch (e) { errToast(e); return App.go('#/records'); }
    if (rd.spread !== 'full') return App.go('#/r/' + encodeURIComponent(rd.id));
    const P1 = FULL.parts[0].cells.length;
    let revealed = rd.revealed || 0, part = revealed >= P1 ? 1 : 0, busy = false;
    const cellAt = i => rd.cards.slice(i * 4, i * 4 + 4);
    const isRep = i => { const m = rd.cards[i * 4]; for (let j = 0; j < i; j++) if (rd.cards[j * 4] === m && j < revealed) return true; return false; };
    const kind = CODE_KINDS[rd.codeKind] || CODE_KINDS.paid;
    const render = () => {
      if (revealed >= FULL_CELLS && rd.status !== '抽牌中') return summary();
      const base = part ? P1 : 0, cells = FULL.parts[part].cells, inPart = Math.max(0, Math.min(cells.length, revealed - base));
      App.mount(`<div class="wrap">
        <a class="back" href="#/">${ic('left')}首頁</a>
        <h1 class="h1">全能量檢測</h1><p class="ctx"><span class="chip blue">代號 ${esc(rd.code)}</span><span>${esc(kind.l)}</span></p>
        <div class="parts">${FULL.parts.map((p, k) => `<button type="button" data-part="${k}" class="${k === part ? 'on' : ''}" ${k === 1 && revealed < P1 ? 'disabled' : ''}>${p.s}<small>${p.n}</small></button>`).join('')}</div>
        <div class="prog"><span>${FULL.parts[part].n}</span><span class="bar"><i style="width:${inPart / cells.length * 100}%"></i></span><span class="num">${inPart}／${cells.length} 格</span></div>
        <div class="cells">${cells.map((c, k) => { const i = base + k, open = i < revealed, ids = cellAt(i), nx = i === revealed; return `<div class="cell ${open ? 'open' : ''} ${nx ? 'next' : ''}" data-cell="${i}"><div class="lb ${c[0].length > 3 ? 'long' : ''}">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="cs">${ids.map((cid, j) => `<div class="w">${j === 0 && open && isRep(i) ? '<span class="rep">重複</span>' : ''}${tc(cid, open, open ? 'flat' : '')}<p class="nm">${open ? esc(card(cid).n) : ''}</p></div>`).join('')}</div>${nx ? `<button class="btn pri sm go" data-flip>翻開${esc(c[0])}這一格</button>` : ''}</div>`; }).join('')}</div>
        ${inPart < cells.length ? `<div class="c blk"><button class="btn ghost sm" data-rest>一次翻完這部分</button></div>` : part === 0 ? `<button class="btn pri full blk" data-p2>繼續第二部分：七大脈輪${ic('right')}</button>` : ''}
        <p class="note box blk">${ic('heart')}<span>大牌每抽一張就放回，同一張大牌可能在不同位置重複出現；兩部分的小牌是獨立的兩副牌。這個牌陣不顯示自動解讀，抽完後會送給 Mia 親自解讀。</span></p>
      </div>`, '', r => {
        const fl = $('[data-flip]', r); if (fl) fl.addEventListener('click', () => flipCells(1, r));
        const rest = $('[data-rest]', r); if (rest) rest.addEventListener('click', () => flipCells(cells.length - inPart, r));
        const p2 = $('[data-p2]', r); if (p2) p2.addEventListener('click', () => { part = 1; render(); });
        $$('[data-part]', r).forEach(b => b.addEventListener('click', () => { part = +b.dataset.part; render(); }));
      });
    };
    const flipCells = async (n, r) => {
      if (busy) return; busy = true;
      const target = Math.min(FULL_CELLS, revealed + n);
      for (let i = revealed; i < target; i++) {
        const el = $(`[data-cell="${i}"]`, r); if (!el) continue;
        el.classList.remove('next'); const b = $('[data-flip]', el); if (b) b.remove();
        $$('.tc', el).forEach((t, j) => setTimeout(() => t.classList.add('on'), j * 160));
        await new Promise(ok => setTimeout(ok, 800));
      }
      revealed = target;
      try { rd = (await api.call('tarotReveal', { readingId: rd.id, revealed })).reading; } catch (e) { errToast(e); }
      busy = false;
      if (revealed >= FULL_CELLS) { await App.loadHome(); }
      render();
    };
    const summary = () => {
      const mia = rd.mia || {};
      const doneTxt = rd.status === '已解讀';
      App.mount(`<div class="wrap">
        <a class="back" href="#/records">${ic('left')}占卜紀錄</a>
        <h1 class="h1">全能量檢測</h1><p class="ctx"><span class="chip ${doneTxt ? 'ok' : ''}">${doneTxt ? '解讀完成' : '已送出'}</span><span>12 張大牌＋36 張小牌</span></p>
        ${doneTxt ? `<section class="card overall blk mia-rd"><h2 class="h2">${ic('spark')}Mia 的解讀</h2>${mia.text ? `<p>${esc(mia.text)}</p>` : ''}${mia.part1 ? `<h3>第一部分・身心靈修業</h3><p>${esc(mia.part1)}</p>` : ''}${mia.part2 ? `<h3>第二部分・七大脈輪</h3><p>${esc(mia.part2)}</p>` : ''}${(mia.files || []).map(f => `<p><button class="tlink" data-file="${esc(f.fileId)}">${ic('book')}開啟 ${esc(f.name)}</button></p>`).join('')}</section>
          ${mia.inReport && !mia.text && !mia.part1 ? `<p class="note blk">${ic('heart')}<span>Mia 的解牌寫在你的總結報告裡。<a class="tlink" href="#/report/${encodeURIComponent(mia.inReport)}">查看總結報告 ›</a></span></p>` : `<section class="card blk c">${mia.ackAt ? `<p class="chip ok">${ic('check')}已確認收到・<span class="num">${esc(U.ts(mia.ackAt))}</span></p>` : `<p class="sub">看完後讓 Mia 知道你收到了</p><button class="btn pri full blk" data-ack>${ic('check')}我已收到解讀</button>`}</section>`}
          ${careBookCta(rd.id, '想針對解讀中的課題，和 Mia 一起處理嗎？', '帶著這次全能量檢測看見的課題與困擾，預約一次塔羅療癒，和 Mia 用引導冥想把它轉成你能走出的下一步。')}`
          : `<section class="card blk"><ol class="steps-v"><li><span class="d">${ic('check')}</span><span><b>使用代號</b><small class="num">${esc(rd.code)}・${esc(U.ts(rd.createdAt))}</small></span></li><li><span class="d">${ic('check')}</span><span><b>牌陣已鎖定</b><small>結果已保存，無法重抽</small></span></li><li><span class="d w">3</span><span><b>Mia 解讀中</b><small>${rd.codeKind === 'post' ? '解讀會整理進你的總結報告' : `${esc(kind.due)}${rd.dueAt ? `（預計 ${esc(U.md(rd.dueAt))} 前）` : ''}・完成後用 LINE 通知你`}</small></span></li></ol></section>
          <p class="note blk">${ic('heart')}<span>網站不會自動產生這個牌陣的解讀，等 Mia 親自寫好再看完整內容。你可以在「我的占卜紀錄」隨時回來看牌面。</span></p>`}
        ${FULL.parts.map((p, k) => `<section class="card blk"><h2 class="h2" style="margin-bottom:10px">${p.s}・${p.n}</h2><div class="cells">${p.cells.map((c, j) => { const i = (k ? P1 : 0) + j; return `<div class="cell open"><div class="lb ${c[0].length > 3 ? 'long' : ''}">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="cs">${cellAt(i).map((cid, x) => `<div class="w">${x === 0 && isRep(i) ? '<span class="rep">重複</span>' : ''}${tc(cid, true, 'flat')}<p class="nm">${esc(card(cid).n)}</p></div>`).join('')}</div></div>`; }).join('')}</div></section>`).join('')}
        <a class="btn sec full blk" href="#/">回到首頁</a>
      </div>`, 'records', r => {
        const ak = $('[data-ack]', r); if (ak) ak.addEventListener('click', async () => { ak.disabled = true; try { rd = (await api.call('tarotAckReading', { readingId: rd.id })).reading; toast('謝謝你，Mia 收到了', 'ok'); summary(); } catch (e) { errToast(e); ak.disabled = false; } });
        $$('[data-file]', r).forEach(b => b.addEventListener('click', async () => {
          try { const x = await api.call('getFile', { fileId: b.dataset.file }); const bin = atob(String(x.data).replace(/^data:[^,]*,/, '')), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); window.open(URL.createObjectURL(new Blob([arr], { type: x.file.type })), '_blank', 'noopener'); } catch (e) { errToast(e); }
        }));
      });
    };
    render();
  }
};

/* ---- 分享圖片（牌面＋牌名＋問題，存成圖片） ---- */
async function shareImage(rd, cs) {
  try {
    const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#F5EEDF'); gr.addColorStop(.45, '#F1EFE9'); gr.addColorStop(1, '#DCE8F6'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
    const ims = await Promise.all(rd.cards.map(id => load(img(id))));
    const sp = SPREADS[rd.spread], n = ims.length;
    g.textAlign = 'center'; g.fillStyle = '#5A4632'; g.font = '600 64px "Cormorant Garamond", serif'; g.fillText('Mia Tarot', W / 2, 120);
    g.font = '500 38px "Noto Serif TC", serif'; g.fillText(sp.n, W / 2, 190);
    g.fillStyle = '#7D7466'; g.font = '30px "Noto Sans TC", sans-serif';
    const q = rd.question.length > 30 ? rd.question.slice(0, 29) + '…' : rd.question; g.fillText(q, W / 2, 245);
    const cw = n === 1 ? 380 : n === 3 ? 280 : 180, ch = cw * 820 / 480, gap = n === 5 ? 18 : 36, total = n * cw + (n - 1) * gap, y = n === 1 ? 320 : 400;
    ims.forEach((im, i) => {
      const x = (W - total) / 2 + i * (cw + gap);
      g.save(); g.shadowColor = 'rgba(60,40,20,.35)'; g.shadowBlur = 24; g.shadowOffsetY = 10; g.drawImage(im, x, y, cw, ch); g.restore();
      g.fillStyle = '#7A5A36'; g.font = `500 ${n === 5 ? 24 : 30}px "Noto Sans TC", sans-serif`; g.fillText(sp.pos[i].l.replace(/ /g, ''), x + cw / 2, y + ch + 46);
      g.fillStyle = '#33384F'; g.fillText(cs[i].n, x + cw / 2, y + ch + (n === 5 ? 80 : 90));
    });
    g.fillStyle = '#5D6B85'; g.font = '26px "Noto Sans TC", sans-serif'; g.fillText('本站占卜不使用逆位・僅供自我探索參考', W / 2, H - 70);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
    const file = new File([blob], 'mia-tarot.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Mia Tarot' }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mia-tarot-' + rd.id + '.png'; document.body.appendChild(a); a.click(); a.remove(); toast('圖片已儲存', 'ok');
  } catch (e) { toast('無法產生圖片，請改用螢幕截圖', 'err'); }
}

/* ---- 啟動 ---- */
(async function boot() {
  const qs = new URLSearchParams(location.search);
  if (!IS_DEMO) await LineAuth.handleReturn();
  if (qs.get('paid') && qs.get('orderId')) {   // 從 LINE Pay／綠界回來
    if (qs.get('transactionId')) U.ss.set('mia.tarot.tx', qs.get('transactionId'));
    history.replaceState(null, '', location.pathname + '#/full/order/' + encodeURIComponent(qs.get('orderId')));
  }
  await App.loadHome();
  window.addEventListener('hashchange', () => App.route());
  App.route();
})();

</script>
