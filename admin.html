    /* old routes redirect (replaceState keeps history clean, query string kept) */
    if (OLD_ROUTES[sub]) { const qs = location.hash.split('?')[1]; AUI.replace('#/admin/' + OLD_ROUTES[sub] + (path.length > 2 ? '/' + path.slice(2).join('/') : '') + (qs ? '?' + qs : '')); return App.route(); }
    if (sub === 'clients') { AUI.replace('#/admin/' + (path[2] === 'companions' ? 'companions' : 'customers')); return App.route(); }
    let fn = '', key = sub, rest = path.slice(2);
    if (sub === '') fn = 'overview';
    else if (sub === 'bookings') fn = 'bookings';
    else if (sub === 'events') fn = 'events';
    else if (sub === 'tarot') { const t = TAROT_TABS.find(x => x[0] === path[2]) ? path[2] : 'pending'; this.ttab = t; key = 'tarot/' + t; rest = path.slice(3); fn = 'tr_' + t; }
    else if (['customers', 'companions', 'sources'].includes(sub)) { fn = sub; this.sec = 'clients'; }
    else if (sub === 'payments') { const t = PAY_TABS.find(x => x[0] === path[2]) ? path[2] : 'checking'; fn = 'payments'; key = 'payments/' + t; this.ptab = t; }
    else if (sub === 'settings') {
      const t = SET_TABS.find(x => x[0] === path[2]) ? path[2] : 'slots'; this.stab = t; key = 'settings/' + t; rest = path.slice(3);
      if (t === 'logs') { this.ltab = path[3] === 'notify' ? 'notify' : 'audit'; fn = this.ltab === 'notify' ? 'notifyLog' : 'audit'; key += '/' + this.ltab; }
      else fn = t;
    }
    if (!fn || typeof this[fn] !== 'function') return App.go('#/admin');
    this.sec = ['customers', 'companions', 'sources'].includes(sub) ? 'clients' : sub;
    if (key !== this.sub) { this._av = null; this._avDirty = false; this._tplDraft = null; this.sel.clear(); }
    this.sub = key; AUI.closePops();

    /* a slower, older route must never paint over a newer one: pages run through a proxy whose mount() is a no-op once stale */
    const rid = this._rid = (this._rid || 0) + 1;
    const px = new Proxy(this, { get: (t, k) => k === 'mount' ? (r, h, b) => (rid === t._rid ? t.mount(r, h, b) : null) : t[k] });
    try { await px[fn](root, rest); }

  /* ---------- payment mode (Settings pay.mode: 'split' 兩段式 | 'full' 一次付清; default split) ---------- */
  async payMode(force) {
    if (force || !this._pm || Date.now() - this._pmAt > 10000) {
      try { const { settings: S } = await api.call('adminGetSettings'); this._pm = S['pay.mode'] === 'full' ? 'full' : 'split'; this._feat = { tarot: !!S['feature.tarot'] && S['feature.tarot'] !== 'FALSE', report: !!S['feature.report'] && S['feature.report'] !== 'FALSE' }; } catch (e) { this._pm = this._pm || 'split'; }

    }
    return this._pm;
  },
  full() { return this._pm === 'full'; },

  /* ---------- shell ---------- */
  /** o = {title, mirror, actions, pri (html, also shown in the phone top bar), sub (subtitle line), seg, tabs}

  tabStrip(tabs, cur, href, cls) {

  },
  secInfo() {

    if (this.sec === 'clients') return { title: '客人', tabs: this.tabStrip(bd(CLIENT_TABS, 'companions', B.companions), this.sub, k => '#/admin/' + k) };
    if (this.sec === 'tarot') return { title: '塔羅', tabs: this.tabStrip(bd(TAROT_TABS, 'pending', B.tarot), this.ttab, k => '#/admin/tarot/' + k) + this.featBar('tarot') };

        <div class="ttl"><div class="tt"><h1>${U.esc(title)}</h1>${o.seg || ''}${o.mirror ? AUI.mirror(o.mirror) : ''}${o.sub ? `<span class="meta">${o.sub}</span>` : ''}</div><div class="r">${o.actions || ''}${o.pri ? `<span class="pri-slot">${o.pri}</span>` : ''}</div></div>

  },
  mount(root, html, bind) {
    root.innerHTML = html;
    const lo = root.querySelector('[data-logout]'); if (lo) lo.addEventListener('click', logout);
    root.querySelectorAll('[data-navx]').forEach(b => b.addEventListener('click', () => document.body.classList.toggle('nav-open')));

    root.querySelectorAll('.nv').forEach(a => a.addEventListener('click', () => document.body.classList.remove('nav-open')));

  async fillBadges(root) {
    const now = Date.now();
    if (!this._badges || now - this._badgeAt > 20000) {
      this._badgeAt = now;
      const T = U.today();
      const [bk, cp, nl, tp] = await Promise.all([
        api.call('adminListBookings', { status: 'CHECKING_ANY', page: 1, pageSize: 1 }).catch(() => null),
        api.call('adminGetCompanions').catch(() => null),
        api.call('adminGetNotifyLog', { status: 'FAILED', from: U.addDays(T, -7), to: T, page: 1, pageSize: 1 }).catch(() => null),
        api.call('adminTarotPending').catch(() => null)
      ]);
      this._badges = {
        payments: bk ? (bk.counts && bk.counts.CHECKING_ANY) || 0 : 0,
        companions: cp ? cp.items.filter(x => (this._feat || {}).report ? (!x.report || ['none', 'draft'].includes(x.report.state)) : !x.reportSent).length : 0,
        tarot: tp ? tp.items.filter(x => x.codeKind !== 'post').length : 0,
        notifyFailed: nl ? (nl.total != null ? nl.total : (nl.items || []).length) : 0
      };
    }
    const B = this._badges;
    if (this._pendPay != null) { B.payments = this._pendPay; this._pendPay = null; }
    const put = (el, v) => { if (el) { el.hidden = !v; el.textContent = v || ''; } };
    put(root.querySelector('[data-badge="payments"]'), B.payments);
    put(root.querySelector('[data-bbadge="payments"]'), B.payments);
    put(root.querySelector('[data-tbadge="checking"]'), B.payments);
    put(root.querySelector('[data-tbadge="companions"]'), B.companions);
    put(root.querySelector('[data-tbadge="logs"]'), B.notifyFailed);
    put(root.querySelector('[data-badge="tarot"]'), B.tarot); put(root.querySelector('[data-bbadge="tarot"]'), B.tarot); put(root.querySelector('[data-tbadge="pending"]'), B.tarot);
  },
  bust() { this._badges = null; this._pm = null; },
  /* keep the 收款 badge in step with counts a page just loaded (authoritative, avoids a stale cache) */
  syncPayBadge(n) { if (n == null || !this._badges) return; this._badges.payments = n; const put = el => { if (el) { el.hidden = !n; el.textContent = n || ''; } }; ['[data-badge="payments"]', '[data-bbadge="payments"]', '[data-tbadge="checking"]'].forEach(q => $$(q).forEach(put)); },

  /* =====================================================================

  async overview(root) {
    const q = AUI.q(); const T = U.today();
    const view = ['day', 'week', 'month'].includes(q.view) ? q.view : this.state.overviewView;
    this.state.overviewView = view; U.ls.set('mia.admin.ov', view);
    const date = /^\d{4}-\d{2}-\d{2}$/.test(q.date || '') ? q.date : T;
    const planId = q.plan || '';
    const [o, { plans }] = await Promise.all([api.call('adminGetOverview', { date, view, planId }), this.plansCached()]);
    const go = (obj) => App.go(AUI.hash('#/admin', Object.assign({ view, date, plan: planId }, obj), { view: 'week-x', date: T }));
    const seg = `<div class="seg ov-seg" role="tablist" aria-label="檢視">${[['day', '日', 'cal-d'], ['week', '週', 'cal-w'], ['month', '月', 'cal-m']].map(([k, l]) => `<button role="tab" aria-selected="${k === view}" class="${k === view ? 'on' : ''}" data-view="${k}">${l}</button>`).join('')}</div>`;
    const planSel = `<select class="inp sel-s" data-plan aria-label="方案篩選"><option value="">全部方案</option>${plans.map(p => `<option value="${p.planId}" ${p.planId === planId ? 'selected' : ''}>${U.esc(p.name)}</option>`).join('')}</select>`;
    const actions = `${planSel}<a class="btn ghost sm hide-m" href="#/admin/settings/slots">${ic('clock')}時段設定</a>`;
    const pri = `<button class="btn pri sm" data-newbk>${ic('plus')}<span>新增預約</span></button>`;
    let body = '';
    if (view === 'month') body = this.monthView(o, date, plans);
    else if (view === 'day') body = this.dayView(o, date);
    else body = this.weekView(o, date);
    if (o.kpi && o.kpi.pendingCheck != null) this._pendPay = o.kpi.pendingCheck;
    const html = this.shell({ title: '今日', seg, mirror: '預約流程・選擇時段', actions, pri }, body);
    this.mount(root, html, r => {
      r.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go({ view: b.dataset.view })));
      r.querySelector('[data-plan]').addEventListener('change', e => go({ plan: e.target.value }));
      r.querySelectorAll('[data-newbk]').forEach(b => b.addEventListener('click', () => this.newBooking({ date: b.dataset.date || (view === 'week' ? '' : date) })));
      r.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
        const n = +b.dataset.nav; let d = date;
        if (b.dataset.nav === '0') d = T; else if (view === 'month') d = U.addMonths(date, n); else d = U.addDays(date, view === 'week' ? 7 * n : n);
        go({ date: d });
      }));
      r.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-newbk]')) return; this.monthSelect(r, b.dataset.day, planId); }));
      r.querySelectorAll('[data-dayview]').forEach(b => b.addEventListener('click', () => go({ view: 'day', date: b.dataset.dayview })));
      this.bindBookingActions(r);
    });

      ${kp('本週預約', 'cal', 'c1', k.weekBookings, '筆', `${k.weekDelta >= 0 ? `<span class="up">↑ ${k.weekDelta}</span>` : `<span class="dn">↓ ${-k.weekDelta}</span>`} 較上週・額滿 ${k.fullDays} 天`, '#/admin/bookings')}
      ${kp('待對帳', 'coin', 'c2', k.pendingCheck, '筆', k.pendingCheck ? '<span class="dn">需確認收款</span>' : '目前沒有待對帳', '#/admin/payments/checking')}
      ${kp('待寄連結', 'video', 'c3', k.pendingLink, '筆', k.pendingLinkToday ? `<span class="dn">${k.pendingLinkToday} 筆三天內服務</span>` : '三天內無待寄', '#/admin/bookings?status=' + (this.full() ? 'CONFIRMED' : 'DEPOSIT_PAID'))}
      ${kp('陪伴中', 'heart', 'c4', k.companionActive, '位', `本週結束 ${k.companionEndingThisWeek} 位・報告待交 ${k.reportsPending}`, '#/admin/companions')}
    </div>`;
  },
  /** 近期待辦: grouped by date (today first; overdue items fold into 今天). In full mode 尾款 items are dropped. */
  todoItems(todos) {
    const full = this.full();
    return (todos || []).filter(t => t.booking && !(full && (t.type === 'confirm_balance' || t.type === 'balance_due')));
  },
  todoRow(t) {
    const m = TODO_META[t.type] || ['待辦', 'bell', 'c1']; const b = t.booking;
    const lbl = this.full() && t.type === 'confirm_deposit' ? '確認付款' : m[0];
    const act = t.type === 'confirm_deposit' ? `<button class="btn pri sm" data-dep="${b.bookingId}">確認收款</button>` : t.type === 'confirm_balance' ? `<button class="btn pri sm" data-bal="${b.bookingId}">確認收款</button>` : t.type === 'send_link' ? `<button class="btn pri sm" data-link="${b.bookingId}">寄送連結</button>` : `<button class="btn ghost sm" data-open="${b.bookingId}">查看</button>`;
    return `<div class="it"><span class="ico ${m[2]}">${ic(m[1])}</span><div class="tx"><b>${lbl}・${U.esc(b.name)}</b><small class="num">${b.date < U.today() ? U.dot(b.date).slice(5) + ' ' : ''}${b.startTime}・${U.esc(b.bookingId)}</small></div>${act}</div>`;
  },
  dayHead(d) { const T = U.today(); return d === T ? '今天' : d === U.addDays(T, 1) ? '明天' : `${U.dot(d)}（${WD[U.dow(d)]}）`; },
  todoCard(todos, title, grouped) {
    const list = this.todoItems(todos); const T = U.today(); const MAX = 12;
    let body = '';
    if (!list.length) body = '<p class="none">待辦都完成了</p>';
    else if (!grouped) body = list.slice(0, 8).map(t => this.todoRow(t)).join('');
    else {
      const key = t => (t.booking.date < T ? T : t.booking.date);
      const sorted = list.slice().sort((a, b) => (key(a) + a.booking.startTime).localeCompare(key(b) + b.booking.startTime) || a.booking.date.localeCompare(b.booking.date));
      const shown = sorted.slice(0, MAX); let cur = '';
      shown.forEach(t => { const k = key(t); if (k !== cur) { cur = k; body += `<h5 class="tdh num ${k === T ? 'now' : ''}">${this.dayHead(k)}</h5>`; } body += this.todoRow(t); });
      if (sorted.length > MAX) body += `<a class="btn txt sm more" href="#/admin/payments/checking">還有 ${sorted.length - MAX} 項 ›</a>`;
    }
    return `<section class="card"><header class="ch"><h3>${title || '近期待辦'}</h3><span class="sub num">${list.length} 項</span></header><div class="cb todo ${grouped ? 'grp' : ''}">${body}</div></section>`;
  },
  weekView(o, date) {
    const T = U.today(); const k = o.kpi;
    const evCls = s => ({ 's-dep': 'e-dep', 's-check': 'e-check', 's-full': 'e-full', 's-unpaid': 'e-unpaid', 's-link': 'e-link', 's-done': 'e-done', 's-noshow': 'e-ns' }[s] || '');
    const isThisWeek = U.weekStart(date) === U.weekStart(T);
    return `${this.kpiRow(k)}
      <div class="g2">
        <div class="stack">
          <section class="card"><header class="ch"><h3>今日行程</h3><span class="sub num">${U.dateLabel(T)}</span>${o.today.items.length ? `<div class="r"><span class="capb num">已預約 ${o.today.used} / ${o.today.cap}<span class="load" style="--p:${Math.min(1, o.today.used / Math.max(1, o.today.cap))}"><i></i></span></span></div>` : ''}</header>
            <div class="cb">${o.today.items.length ? o.today.items.map(b => `<div class="trow"><span class="tm num">${b.startTime}<small>– ${b.endTime}</small></span><span class="who"><b>${U.esc(b.name)}</b><small>${AUI.tagPlan(b.planStyle, b.planName)}<span class="num">${U.esc(b.bookingId)}</span></small></span><span class="st ${b.statusClass}">${b.statusLabel}</span><span class="acts">${b.zoomLink ? `<a class="btn ghost sm" href="${U.esc(b.zoomLink)}" target="_blank" rel="noopener">${ic('video')}Zoom</a>` : ''}<button class="btn soft sm" data-open="${b.bookingId}">明細</button></span></div>`).join('') : '<p class="none">今天沒有預約行程</p>'}</div></section>
          <section class="card"><header class="ch"><h3>本週時段</h3><span class="sub num">${U.dot(o.week.start).slice(5)} – ${U.dot(o.week.end).slice(5)}</span><div class="r nav2"><button class="ib" data-nav="-1" aria-label="上一週">${ic('left')}</button>${isThisWeek ? '' : '<button class="btn txt sm" data-nav="0">回到本週</button>'}<button class="ib" data-nav="1" aria-label="下一週">${ic('right')}</button></div></header>
            <div class="cb"><div class="week">${o.week.days.map(d => `<div class="wk ${d.date === T ? 'now' : ''} ${d.off ? 'off' : ''} ${d.date < T ? 'past' : ''}"><div class="dh"><button class="dnum num" data-dayview="${d.date}" aria-label="查看 ${U.dateLabel(d.date)}">${+d.date.slice(8)}</button><span>週${WD[d.weekday]}</span>${d.date >= T ? `<button class="add" data-newbk data-date="${d.date}" aria-label="在 ${U.dateLabel(d.date)} 新增預約" title="新增預約">${ic('plus')}</button>` : ''}</div>${d.off && !d.events.length ? '<div class="offl">不開放</div>' : d.events.map(e => `<button class="ev ${evCls(e.statusClass)}" data-open="${e.bookingId}"><b class="num">${e.time}</b><span>${U.esc(e.name)}</span></button>`).join('') + (d.free || []).map(t => `<span class="ev free num">${t}</span>`).join('')}</div>`).join('')}</div>
            <p class="lgd"><span><i class="e-dep"></i>訂金已付</span><span><i class="e-check"></i>待對帳</span><span><i class="e-unpaid"></i>待付訂金</span><span><i class="free"></i>仍可預約</span></p></div></section>
        </div>
        <div class="stack">
          ${this.todoCard(o.todos, '近期待辦', true)}
          <section class="card"><header class="ch"><h3>陪伴追蹤</h3><div class="r"><a class="btn txt sm" href="#/admin/companions">全部 ›</a></div></header><div class="cb comp">${o.companions.length ? o.companions.slice(0, 5).map(c => `<div class="it"><span class="who"><b>${U.esc(c.name)}</b><small>${U.esc(c.planName)}</small></span><span class="dd num">第 ${c.day} / ${c.total} 天</span><span class="load ${c.day >= c.total - 2 ? 'end' : ''}" style="--p:${c.day / c.total}"><i></i></span></div>`).join('') : '<p class="none">目前沒有陪伴中的客人</p>'}</div></section>
        </div>
      </div>`;
  },
  dayView(o, date) {
    const T = U.today(); const d = o.day || { date, items: [], free: [], cap: 0, used: 0, state: 'closed', weekday: U.dow(date) };
    const rows = d.items.map(b => ({ t: b.startTime, b })).concat((d.free || []).map(t => ({ t }))).sort((a, b) => a.t.localeCompare(b.t));
    const stLabel = { off: '不在開放範圍', closed: '休息日', open: `空 ${(d.free || []).length}`, full: '滿檔' }[d.state] || '';
    const todos = (o.todos || []).filter(t => t.booking && t.booking.date === date);
    return `${this.kpiRow(o.kpi)}
      <div class="g2">
        <section class="card"><header class="ch day-h"><div class="nav2"><button class="ib" data-nav="-1" aria-label="前一天">${ic('left')}</button><h3 class="num">${U.dateLabel(date, true)}</h3><button class="ib" data-nav="1" aria-label="後一天">${ic('right')}</button>${date === T ? '' : '<button class="btn txt sm" data-nav="0">回到今天</button>'}</div>
          <div class="r"><span class="mark ${d.state === 'full' ? 'full' : d.state === 'open' ? 'free' : 'off'}">${stLabel}</span>${d.items.length ? `<span class="capb num">已預約 ${d.used} / ${d.cap}<span class="load" style="--p:${d.cap ? Math.min(1, d.used / d.cap) : 0}"><i></i></span></span>` : ''}</div></header>
          <div class="cb">${d.items.length ? '' : `<p class="none tl-none">${date === T ? '今天沒有預約行程' : '這天沒有預約行程'}${d.state === 'closed' ? '<small>這天休息，不開放預約</small>' : d.state === 'off' ? '<small>這天不在前台開放範圍內</small>' : (d.free || []).length ? '<small>以下時段前台仍可預約</small>' : ''}</p>`}<ol class="tl">${rows.length ? rows.map(x => x.b ? `<li class="slot"><span class="tm num">${x.b.startTime}<small>${x.b.endTime}</small></span><div class="sb"><span class="who"><b>${U.esc(x.b.name)}</b><small>${AUI.tagPlan(x.b.planStyle, x.b.planName)}<span class="num">${U.esc(x.b.phone || '')}</span></small></span><span class="st ${x.b.statusClass}">${x.b.statusLabel}</span>${this.rowActions(x.b)}</div></li>`
            : `<li class="slot free"><span class="tm num">${x.t}</span><div class="sb"><span class="fr">空檔・前台可預約</span>${date >= T ? `<button class="btn ghost sm" data-newbk data-date="${date}">${ic('plus')}新增</button>` : ''}</div></li>`).join('') : ''}</ol></div></section>
        <div class="stack">
          ${date === T ? this.todoCard(o.todos, '近期待辦', true) : this.todoCard(todos, '當日待辦')}
          <section class="card"><header class="ch"><h3>快速操作</h3></header><div class="cb qa">
            <button class="btn pri" data-newbk data-date="${date}">${ic('plus')}新增這天的預約</button>
            <a class="btn ghost" href="#/admin/bookings?from=${date}&to=${date}">${ic('list')}開啟當日清單</a>
            <a class="btn ghost" href="#/admin/settings/slots">${ic('clock')}調整這天的時段</a></div></section>
        </div>
      </div>`;
  },
  monthView(o, date) {
    const T = U.today(); const m = o.month || { days: [], summary: {} }; const ms = U.monthStart(date);
    const lead = m.days.length && m.days[0].date === ms ? U.dow(ms) : 0;
    const cells = []; for (let i = 0; i < lead; i++) cells.push(`<div class="day out" aria-hidden="true"><span class="d num">${+U.addDays(ms, i - lead).slice(8)}</span></div>`);
    m.days.forEach(d => {
      const out = d.date.slice(0, 7) !== ms.slice(0, 7);
      const mk = d.state === 'full' ? '<span class="mark full">滿檔</span>' : (d.state === 'closed' ? '<span class="mark off">休</span>' : (d.state === 'open' && !d.used && d.date >= T ? '<span class="mark none">尚無預約</span>' : ''));
      const p = d.cap ? Math.min(1, d.used / d.cap) : 0;
      cells.push(`<div class="day ${out ? 'out' : ''} ${d.date === T ? 'today' : ''} ${d.date === date ? 'sel' : ''} ${d.state} ${d.date < T ? 'past' : ''}" data-day="${d.date}" role="button" tabindex="0" aria-label="${U.dateLabel(d.date)} ${d.used}/${d.cap}">
        <span class="d"><span class="num dnum">${+d.date.slice(8)}</span><small class="wdl">週${WD[U.dow(d.date)]}</small>${mk}</span>
        ${d.state === 'open' || d.state === 'full' || d.used ? `<span class="load" style="--p:${p}"><i></i></span><span class="cnt num"><b>${d.used}／${d.cap}</b>${d.free ? `<span>空 ${d.free}</span>` : ''}</span>` : ''}
        <span class="dots">${(d.dots || []).slice(0, 8).map(s => `<i class="p-${s}"></i>`).join('')}</span>
        ${d.date >= T && d.state !== 'closed' ? `<button class="add" data-newbk data-date="${d.date}" aria-label="在 ${U.dateLabel(d.date)} 新增預約" title="新增預約">${ic('plus')}</button>` : ''}</div>`);
    });
    while (cells.length % 7) cells.push('<div class="day out" aria-hidden="true"></div>');
    const s = m.summary || {};
    return `<div class="mwrap">
      <section class="card cal"><header class="mhead"><h2 class="num">${ms.slice(0, 4)}.${ms.slice(5, 7)}</h2><div class="nav2"><button class="ib" data-nav="-1" aria-label="上個月">${ic('left')}</button><button class="ib" data-nav="1" aria-label="下個月">${ic('right')}</button></div>${ms.slice(0, 7) !== T.slice(0, 7) ? '<button class="btn txt sm" data-nav="0">回到今天</button>' : ''}
        <div class="lg"><span><i class="lb"></i>已預約／可預約</span><span class="mark full">滿檔</span><span class="mark off">休</span>未開放</div></header>
        <div class="mgrid">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div></section>
      <aside class="stack">
        <section class="card selp" data-selp>${this.selPanel(o.selected, date)}</section>
        <section class="card"><header class="ch"><h3>本月概況</h3></header><div class="cb"><div class="sumg">
          <div><small>已預約</small><b class="num">${s.booked || 0}</b><span>／可預約 ${s.capacity || 0}</span></div>
          <div><small>滿檔日</small><b class="num">${s.fullDays || 0}</b><span>天</span></div>
          <div><small>剩餘時段</small><b class="num">${s.freeSlots || 0}</b><span>個</span></div>
          <div><small>待對帳</small><b class="num">${s.pendingCheck || 0}</b><span>筆</span></div></div></div></section>
      </aside></div>`;
  },
  selPanel(sel, date) {
    sel = sel || { date, items: [], cap: 0, used: 0, state: 'closed' };
    const free = Math.max(0, (sel.cap || 0) - (sel.used || 0));
    const T = U.today();
    return `<header class="ch"><h3 class="num">${U.dateLabel(sel.date || date)}</h3><span class="sub">${sel.state === 'closed' ? '休息日' : sel.state === 'off' ? '未開放' : `${sel.cap} 個時段・${sel.state === 'full' ? '已滿' : '空 ' + free}`}</span></header>
      <div class="cb"><ul class="dlist">${(sel.items || []).length ? sel.items.map(b => `<li><button data-open="${b.bookingId}"><span class="t num">${b.startTime}</span><span class="who"><b>${U.esc(b.name)}</b><small>${U.esc(b.planName)}</small></span><span class="st ${b.statusClass}">${b.statusLabel}</span></button></li>`).join('') : '<li class="none">這天沒有預約</li>'}</ul>
      <div class="selbtns"><a class="btn ghost full" href="#/admin/bookings?from=${sel.date || date}&to=${sel.date || date}">開啟當日清單</a>${(sel.date || date) >= T && sel.state !== 'closed' ? `<button class="btn soft full" data-newbk data-date="${sel.date || date}">${ic('plus')}新增這天的預約</button>` : ''}</div></div>`;
  },
  async monthSelect(r, d, planId) {
    r.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel')); const c = r.querySelector(`[data-day="${d}"]`); if (c) c.classList.add('sel');

  /* ---------- shared booking actions ---------- */
  bindBookingActions(r) {
    const on = (sel, fn) => r.querySelectorAll(sel).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); fn(b); }));
    on('[data-open]', b => this.bookingDrawer(b.dataset.open));
    on('[data-dep]', b => this.confirmPay(b.dataset.dep, 'deposit'));
    on('[data-bal]', b => this.confirmPay(b.dataset.bal, 'balance'));
    on('[data-link]', b => this.zoomDialog(b.dataset.link));
    on('[data-done]', b => this.markDone(b.dataset.done));
    on('[data-more]', b => this.moreMenu(b, b.dataset.more, b.dataset.st));
  },
  after(msg) { if (msg) toast(msg, 'ok'); AUI.closeDrawer(); this.bust(); this.rerender(); },
  async confirmPay(id, kind) {
    const { booking: b } = await api.call('adminGetBooking', { bookingId: id });
    const isDep = kind === 'deposit';
    const ok = await modal({
      title: isDep ? (this.full() ? '確認付款' : '確認訂金收款') : '確認尾款收款', ok: '確認收款',
      html: `<dl class="kv"><dt>預約</dt><dd>${U.esc(b.name)}・<span class="num">${U.esc(b.bookingId)}</span></dd><dt>金額</dt><dd class="num">${U.money(isDep ? b.deposit : b.balance)}</dd><dt>付款方式</dt><dd>${(PAY_META[isDep ? b.depositMethod : b.balanceMethod] || {}).label || '—'}</dd><dt>參考碼</dt><dd class="num">${U.esc((isDep ? b.depositRef : b.balanceRef) || '—')}</dd></dl><p class="mnote">確認後會由官方 LINE 傳送「${isDep ? (this.full() ? '付款確認' : '訂金確認') : '尾款確認'}」通知給客人。</p>`,
      onOk: () => api.call(isDep ? 'adminConfirmDeposit' : 'adminConfirmBalance', { bookingId: id })
    });
    if (ok) this.after('已確認收款');
  },
  async zoomDialog(id) {
    const { booking: b } = await api.call('adminGetBooking', { bookingId: id });
    const ok = await modal({
      title: '寄送 Zoom 連結', ok: '儲存',
      html: `${!this.full() && b.balance > 0 && b.balanceStatus !== 'PAID' ? `<p class="note warn">${ic('warn')}尾款尚未付清，仍可先寄送連結。</p>` : ''}<dl class="kv"><dt>預約</dt><dd>${U.esc(b.name)}・<span class="num">${U.dateLabel(b.date)} ${b.startTime}</span></dd></dl>
        ${AUI.field({ label: 'Zoom 連結', id: 'zl', req: true, ph: 'https://zoom.us/j/…', value: b.zoomLink })}
        <button type="button" class="ck on" data-ck id="zs"><span class="box">${ic('check')}</span><span>立即傳送「服務前提醒」到客人的 LINE<small>取消勾選則只儲存連結，系統會在服務前 3 天晚上自動傳送。</small></span></button>`,
      onOpen(sc) { const c = sc.querySelector('#zs'); c.addEventListener('click', () => c.classList.toggle('on')); },
      onOk: sc => api.call('adminSendZoomLink', { bookingId: id, zoomLink: sc.querySelector('#zl').value.trim(), send: sc.querySelector('#zs').classList.contains('on') })
    });
    if (ok) this.after(ok.notify && ok.notify.status === 'SENT' ? '已寄送連結到 LINE' : ok.notify && ok.notify.reason === 'not_friend' ? '已儲存，客人尚未加入官方 LINE' : '已儲存連結');
  },
  async simpleAct(id, action, title, html, okLabel, danger, extra) {
    const ok = await modal({ title, html, ok: okLabel, danger, onOk: sc => api.call(action, Object.assign({ bookingId: id }, extra ? extra(sc) : {})) });
    if (ok) this.after('已完成：' + title);
  },
  markDone(id) { return this.simpleAct(id, 'adminMarkDone', '標記完成', `<p>標記後開始陪伴期，並傳送「陪伴期開始」通知。</p>`, '標記完成'); },
  markNoShow(id) { return this.simpleAct(id, 'adminMarkNoShow', '標記未出席', `<p>標記後${this.full() ? '費用' : '訂金'}不退，客人的未出席次數 +1，累積達上限將不再受理預約。</p>`, '標記未出席', true); },
  cancelBk(id) { return this.simpleAct(id, 'adminCancelBooking', '取消預約', `<p>取消後時段會釋出，已付${this.full() ? '費用' : '訂金'}不退。</p>${AUI.field({ label: '取消原因', id: 'cr', max: 60 })}`, '取消預約', true, sc => ({ reason: sc.querySelector('#cr').value })); },
  async rescheduleBk(id) {
    const { booking: b } = await api.call('adminGetBooking', { bookingId: id });
    let date = '';
    const ok = await modal({
      title: '改期', ok: '確認改期',
      html: `<dl class="kv"><dt>原時段</dt><dd class="num">${U.dateLabel(b.date, true)} ${b.startTime}</dd></dl><div class="row2"><label class="fld"><span class="lbl">新日期</span><input class="inp" type="date" id="rd" min="${U.today()}"></label><label class="fld"><span class="lbl">可預約時段</span><select class="inp" id="rt" disabled><option>先選日期</option></select></label></div>
        <button type="button" class="ck" id="rc"><span class="box">${ic('check')}</span><span>計入客人的改期次數</span></button>`,
      onOpen(sc) {
        const c = sc.querySelector('#rc'); c.addEventListener('click', () => c.classList.toggle('on'));
        sc.querySelector('#rd').addEventListener('change', async e => {
          date = e.target.value; const sel = sc.querySelector('#rt');
          const pv = await api.call('adminPreviewSlots', { date });

  /* =====================================================================
     操作紀錄 / 通知紀錄 — default 近 30 天, paged
     ===================================================================== */
  logState(base) { const q = AUI.q(); const T = U.today(); return { type: q.type || '', status: q.status || '', q: q.q || '', from: q.from != null ? q.from : U.addDays(T, -30), to: q.to != null ? q.to : T, page: Math.max(1, +q.page || 1), ps: [20, 50, 100].includes(+q.ps) ? +q.ps : 50 }; },
  logHash(base, s) { const T = U.today(); return AUI.hash(base, s, { from: U.addDays(T, -30), to: T, page: 1, ps: 50 }); },
  rangeChip(s) { const T = U.today(); const def = s.from === U.addDays(T, -30) && s.to === T; return `<button class="fbtn on" data-lrange>${ic('cal')}<span class="num">${def ? '近 30 天' : !s.from && !s.to ? '全部日期' : `${U.dot(s.from) || '…'} – ${U.dot(s.to) || '…'}`}</span>${ic('down', 'cv')}</button>`; },
  diffHtml(a) {
    let b = {}, c = {}; const parse = x => (x && typeof x === 'object') ? x : JSON.parse(x || '{}'); try { b = parse(a.before); c = parse(a.after); } catch (e) { }
    const keys = Array.from(new Set(Object.keys(b).concat(Object.keys(c)))).slice(0, 6);
    const v = x => x === true ? '是' : x === false ? '否' : x == null || x === '' ? '空' : typeof x === 'object' ? JSON.stringify(x).slice(0, 60) : String(x).slice(0, 60);
    return keys.length ? keys.map(k => `${U.esc(FIELD_LABEL[k] || k)}：<del>${U.esc(v(b[k]))}</del> → <ins>${U.esc(v(c[k]))}</ins>`).join('<br>') : U.esc(a.note || '—');
  },
  logSeg() { return `<div class="seg sm log-seg" role="tablist" aria-label="紀錄類別">${LOG_TABS.map(([k, l]) => `<a role="tab" class="${this.ltab === k ? 'on' : ''}" aria-selected="${this.ltab === k}" href="#/admin/settings/logs/${k}">${l}</a>`).join('')}</div>`; },
  async audit(root) {
    const s = this.logState(); const base = '#/admin/settings/logs/audit';
    const res = await api.call('adminGetAuditLog', { targetType: s.type, q: s.q, from: s.from, to: s.to, page: s.page, pageSize: s.ps });
    const html = this.shell({ title: '操作紀錄', seg: this.logSeg(), sub: '記錄每一次後台變更，追查問題時使用' }, `
      <section class="card flush lst"><div class="utabs" role="tablist">${[['', '全部'], ['booking', '預約'], ['plan', '方案'], ['content', '網站內容'], ['faq', '常見問題'], ['quiz', '尋找你的星球'], ['availability', '時段'], ['override', '例外日'], ['template', '通知範本'], ['settings', '設定'], ['customer', '客戶'], ['admin', '管理員']].map(([k, l]) => `<button role="tab" class="${s.type === k ? 'on' : ''}" data-at="${k}">${l}</button>`).join('')}</div>
        <div class="tools"><label class="srch">${ic('search')}<input class="inp" data-lq placeholder="搜尋預約編號或內容" value="${U.esc(s.q)}" aria-label="搜尋紀錄"></label>${this.rangeChip(s)}</div>
        <div class="tw"><table class="tb lg-tb"><thead><tr><th>時間</th><th>管理員</th><th>動作</th><th>對象</th><th>變更內容</th></tr></thead><tbody>
        ${(res.items || []).map(a => `<tr><td class="c-when num">${U.tsLabel(a.ts)}</td><td class="c-who"><b>${U.esc(a.adminName || '—')}</b></td><td class="c-st"><span class="st s-link">${ACTION_LABEL[a.action] || U.esc(a.action)}</span></td><td class="c-tg"><b>${TARGET_LABEL[a.targetType] || U.esc(a.targetType)}</b><small class="num">${U.esc(String(a.targetId).slice(0, 40))}</small></td><td class="c-diff"><div class="diff">${this.diffHtml(a)}</div></td></tr>`).join('') || `<tr class="none-r"><td colspan="5">${AUI.empty('這段期間沒有操作紀錄')}</td></tr>`}
        </tbody></table></div>${AUI.pager(res, '筆')}</section>`);
    this.mount(root, html, r => this.bindLog(r, base, s));
  },
  bindLog(r, base, s) {
    const go = (patch, keep) => { const n = Object.assign(this.logState(), patch); if (!keep) n.page = 1; App.go(this.logHash(base, n)); };
    r.querySelectorAll('[data-at]').forEach(b => b.addEventListener('click', () => go({ type: b.dataset.at })));
    r.querySelectorAll('[data-ns2]').forEach(b => b.addEventListener('click', () => go({ status: b.dataset.ns2 })));
    const qi = r.querySelector('[data-lq]'); if (qi) qi.addEventListener('input', AUI.debounce(() => { const n = Object.assign(this.logState(), { q: qi.value.trim(), page: 1 }); AUI.replace(this.logHash(base, n)); App.route().then(() => this.refocus('[data-lq]')); }, 300));
    r.querySelector('[data-lrange]').addEventListener('click', e => this.rangePop(e.currentTarget, s, (from, to) => go({ from, to })));
    AUI.bindPager(r, p => go({ page: p }, true), ps => go({ ps }));
    r.querySelectorAll('[data-rs2]').forEach(b => b.addEventListener('click', () => this.run(() => api.call('adminResendNotify', { logId: b.dataset.rs2 }), '已重送')));
  },
  async notifyLog(root) {
    const s = this.logState(); const base = '#/admin/settings/logs/notify';
    const res = await api.call('adminGetNotifyLog', { status: s.status, bookingId: s.q, from: s.from, to: s.to, page: s.page, pageSize: s.ps });
    const kind = k => ({ push: '客人通知', reply: '自動回覆', admin_alert: '管理員通知', test: '測試' }[k] || k);
    const html = this.shell({ title: '通知紀錄', seg: this.logSeg(), sub: '所有 LINE 訊息的傳送結果' }, `
      <section class="card flush lst"><div class="utabs" role="tablist">${[['', '全部'], ['SENT', '已傳送'], ['SKIPPED', '略過'], ['FAILED', '失敗']].map(([k, l]) => `<button role="tab" class="${s.status === k ? 'on' : ''}" data-ns2="${k}">${l}</button>`).join('')}</div>
        <div class="tools"><label class="srch">${ic('search')}<input class="inp" data-lq placeholder="搜尋預約編號" value="${U.esc(s.q)}" aria-label="搜尋預約編號"></label>${this.rangeChip(s)}</div>
        <div class="tw"><table class="tb lg-tb"><thead><tr><th>時間</th><th>類型</th><th>訊息</th><th>對象</th><th>預約編號</th><th>結果</th><th><span class="sr">操作</span></th></tr></thead><tbody>
        ${(res.items || []).map(n => { let m = {}; try { m = JSON.parse(n.messageJson || '{}'); } catch (e) { } return `<tr><td class="c-when num">${U.tsLabel(n.ts)}</td><td>${kind(n.kind)}</td><td class="c-who c-msg"><b>${U.esc(n.templateKey ? this.tplName(n.templateKey) : (m.title || '通知'))}</b><small>${U.esc(String(m.body || '').slice(0, 70))}</small></td><td>${U.esc(n.customerName || '')}</td><td class="num">${U.esc(n.bookingId || '')}</td>
          <td class="c-st">${n.status === 'SENT' ? '<span class="light ok">已傳送</span>' : n.status === 'FAILED' ? `<span class="light err">失敗${n.httpCode ? ' ' + n.httpCode : ''}</span>` : `<span class="light unset">略過・${this.reason(n.reason)}</span>`}</td>
          <td class="c-act">${n.templateKey && n.bookingId && n.kind === 'push' ? `<button class="btn ghost sm" data-rs2="${n.logId}">重送</button>` : ''}</td></tr>`; }).join('') || `<tr class="none-r"><td colspan="7">${AUI.empty('這段期間沒有通知紀錄')}</td></tr>`}
        </tbody></table></div>${AUI.pager(res, '筆')}</section>`);
    this.mount(root, html, r => this.bindLog(r, base, s));
  }
};

Object.assign(Admin, {
  varDefs(scope, tplKey) { return (VAR_DEFS[scope] || []).filter(d => !d.only || d.only.indexOf(tplKey || '') >= 0); },
  varChips(scope, tplKey) {
    return `<div class="vars vchips"><span>插入變數</span>${this.varDefs(scope, tplKey).map(d => `<button type="button" class="chip" data-ins="{${d.k}}" title="${U.esc(d.d)}・例：${U.esc(d.ex)}">{${d.k}}</button>`).join('')}<button type="button" class="tlink sm" data-varhelp="${scope}" data-tk="${U.esc(tplKey || '')}">變數說明</button></div>`;
  },
  varTable(scope, tplKey) {
    return `<table class="vtbl"><tbody>${this.varDefs(scope, tplKey).map(d => `<tr><td><code class="vk">{${d.k}}</code></td><td>${U.esc(d.d)}<small>例：${U.esc(d.ex)}</small></td></tr>`).join('')}</tbody></table>`;
  },
  /* 在畫面上列出變數問題；有錯誤時停用儲存按鈕 */
  varIssues(box, res, saveBtn) {
    if (!box) return;
    const err = res.errors, inf = res.infos;
    const seen = new Set(); const uniq = a => a.filter(x => { const k = x.msg; if (seen.has(k)) return false; seen.add(k); return true; });
    const e2 = uniq(err), i2 = uniq(inf);
    box.innerHTML = e2.length || i2.length ? `<div class="var-chk ${e2.length ? 'bad' : 'info'}" role="${e2.length ? 'alert' : 'status'}">${e2.map(x => `<p>${ic('x')}<span>${U.esc(x.msg)}</span>${x.suggest ? `<button type="button" class="btn xs ghost" data-varfix="${U.esc(x.name)}|${U.esc(x.suggest)}">改成 {${U.esc(x.suggest)}}</button>` : ''}</p>`).join('')}${i2.map(x => `<p class="i">${ic('sparkle')}<span>${U.esc(x.msg)}</span><button type="button" class="btn xs ghost" data-varfix="${U.esc(x.name)}|${U.esc(x.suggest)}">改成 {${U.esc(x.suggest)}}</button></p>`).join('')}${e2.length ? '<small>修正後才能儲存</small>' : ''}</div>` : '';
    if (saveBtn) { saveBtn.classList.toggle('blocked', !!e2.length); saveBtn.title = e2.length ? '請先修正變數錯誤' : ''; }
    box.querySelectorAll('[data-varfix]').forEach(b => b.addEventListener('click', () => {
      const [from, to] = b.dataset.varfix.split('|'); const scope = box.closest('section, .card, .dlg') || document;
      scope.querySelectorAll('input.inp, textarea.inp, [data-f]').forEach(i => { if (typeof i.value === 'string' && i.value.indexOf('{' + from + '}') >= 0) { i.value = i.value.split('{' + from + '}').join('{' + to + '}'); i.dispatchEvent(new Event('input', { bubbles: true })); } });
    }));
  },
  /* 「插入變數」：插到最後一次點選的欄位（沒有點過就用 fallback） */
  bindVarIns(root, fallback) {
    let last = fallback || null;
    root.addEventListener('focusin', e => { if (e.target.matches('input.inp, textarea.inp')) last = e.target; });
    root.querySelectorAll('[data-ins]').forEach(b => {
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', () => { const i = last; if (!i) { toast('先點選要插入的欄位'); return; } const p = i.selectionStart == null ? i.value.length : i.selectionStart; i.value = i.value.slice(0, p) + b.dataset.ins + i.value.slice(i.selectionEnd == null ? p : i.selectionEnd); i.dispatchEvent(new Event('input', { bubbles: true })); i.focus(); const np = p + b.dataset.ins.length; try { i.setSelectionRange(np, np); } catch (e) { } });
    });
    root.querySelectorAll('[data-varhelp]').forEach(b => b.addEventListener('click', () => modal({ title: '可用變數・' + VAR_SCOPE_LABEL[b.dataset.varhelp], html: `<p class="mnote">點「插入變數」會插到游標位置。變數名稱打錯、括號不成對、用錯地方時，會標出來並擋下儲存。</p>${this.varTable(b.dataset.varhelp, b.dataset.tk)}`, cancel: '關閉' })));
  },

  /* ---------- 設定 › 變數：變數清單＋變數健檢 ---------- */
  async vars(root) {
    const h = this._varHealth || null;
    const scopeChip = s => `<span class="mark ${s === 'notify' ? 'warm' : 'cool'}">${s === 'notify' ? '通知訊息' : '網站內容'}</span>`;
    const all = [].concat(VAR_DEFS.site.map(d => Object.assign({ s: 'site' }, d)), VAR_DEFS.notify.map(d => Object.assign({ s: 'notify' }, d)));
    const kpi = (l, v, cls) => `<div class="kp ${cls || ''}"><small>${l}</small><b class="num">${v}</b></div>`;
    const html = this.shell({ title: '變數', mirror: '通知訊息・網站內容・方案內容・常見問題', sub: '全平台共用一份變數清單', pri: `<button class="btn pri sm" data-vrun>${ic('refresh')}<span>立即檢查</span></button>` }, `
      <section class="card"><header class="ch"><h3>變數健檢</h3><span class="sub">${h ? '上次檢查 <span class="num">' + U.tsLabel(h.at) + '</span>' : '尚未檢查，按「立即檢查」掃描全平台'}</span></header>
        <div class="cb">${h ? `<div class="vkpis">${kpi('掃描位置', h.places + ' 處')}${kpi('掃描欄位', h.fields + ' 個')}${kpi('使用變數', h.uses + ' 次')}${kpi('需要修正', h.issues.length + ' 個', h.issues.length ? 'bad' : 'ok')}${kpi('建議改名', h.infos.length + ' 個')}</div>
          ${h.issues.length || h.infos.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>位置</th><th>欄位</th><th>問題</th><th></th></tr></thead><tbody>${h.issues.map(x => `<tr class="bad"><td>${U.esc(x.where)}</td><td>${U.esc(x.field)}</td><td>${U.esc(x.msg)}</td><td>${x.link ? `<a class="lnk" href="${x.link}">前往修正</a>` : ''}</td></tr>`).join('')}${h.infos.map(x => `<tr><td>${U.esc(x.where)}</td><td>${U.esc(x.field)}</td><td class="muted">${U.esc(x.msg)}</td><td>${x.link ? `<a class="lnk" href="${x.link}">前往</a>` : ''}</td></tr>`).join('')}</tbody></table></div>` : `<p class="ok-line">${ic('check')}全平台的變數都正確</p>`}` : '<p class="mnote">健檢會掃描：通知訊息、網站內容、方案內容、常見問題，找出打錯的變數、括號不成對、用錯地方的變數。</p>'}</div></section>
      <section class="card"><header class="ch"><h3>變數清單</h3><span class="sub">所有編輯畫面的「插入變數」都讀這份清單</span></header>
        <div class="cb"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>變數</th><th>意思</th><th>可以用在</th><th>範例值</th></tr></thead><tbody>${all.map(d => `<tr><td><code class="vk">{${d.k}}</code>${d.alias ? `<small class="muted">　原 {${d.alias.join('}、{')}}</small>` : ''}</td><td>${U.esc(d.d)}</td><td>${scopeChip(d.s)}${d.only ? `<small class="muted">　限「${d.onlyLabel || d.only.map(k => TPL_NAME[k] || k).join('、')}」</small>` : ''}</td><td class="muted">${U.esc(d.ex)}</td></tr>`).join('')}</tbody></table></div>
        <p class="mnote">舊名稱仍會正常代入，不會壞掉；健檢會提醒改用新名稱。需要新的變數時，加進這份清單後所有編輯畫面會自動出現。</p></div></section>`);
    this.mount(root, html, r => {
      r.querySelectorAll('[data-vrun]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; try { this._varHealth = await api.call('adminVarHealth'); toast(this._varHealth.issues.length ? `找到 ${this._varHealth.issues.length} 個需要修正的地方` : '檢查完成，變數都正確', this._varHealth.issues.length ? 'err' : 'ok'); this.vars(root); } catch (e) { errToast(e); b.disabled = false; } }));
    });
  }
});

Object.assign(Admin, {
  _cDraft: {},     // { key: value } unsaved edits across sections
  _pdDraft: {},    // { planId: {field: value} }
  async content(root, rest) {
    const [x, { settings: S }, faq] = await Promise.all([api.call('adminGetSiteContent'), api.call('adminGetSettings'), api.call('adminGetFaq').catch(() => null)]);
    this._site = x; this._siteS = S;
    let sec = rest[0] || 'hero';
    if (sec === 'faq') return App.go('#/admin/settings/faq');
    if (sec === 'quiz') return App.go('#/admin/settings/quiz');
    const isPlan = sec === 'plan';
    const planId = isPlan ? (rest[1] || (x.plans[0] || {}).planId) : '';
    if (!isPlan && !CONTENT_SECTIONS.find(s => s.id === sec)) sec = 'hero';
    const plan = isPlan ? x.plans.find(p => p.planId === planId) : null;
    if (isPlan && !plan) return App.go('#/admin/settings/content');
    const dirtySecs = this.contentDirtySections();
    const navItem = (href, icon, name, on, extra, dirty) => `<a class="sn ${on ? 'on' : ''}" href="${href}" ${on ? 'aria-current="page"' : ''}>${icon}<span>${U.esc(name)}</span>${dirty ? '<i class="dot" title="尚未儲存"></i>' : ''}${extra ? `<small>${extra}</small>` : ''}</a>`;
    const snav = `<nav class="card snav" aria-label="內容區塊"><h5>首頁</h5>${CONTENT_SECTIONS.filter(s => s.id !== 'footer').map(s => navItem('#/admin/settings/content/' + s.id, `<span class="si">${ic(s.icon)}</span>`, s.name, !isPlan && s.id === sec, '', dirtySecs.includes(s.id))).join('')}
      ${navItem('#/admin/settings/quiz', `<span class="si">${ic('quiz')}</span>`, '尋找你的星球區塊', false, x.content['quiz.enabled'] === false ? '未上架' : '')}
      ${navItem('#/admin/settings/faq', `<span class="si">${ic('faq')}</span>`, '常見問題', false, faq ? `${faq.homeCount || 0} 題` : '')}
      <h5>方案內容</h5>${x.plans.map(p => navItem('#/admin/settings/content/plan/' + p.planId, AUI.pl(p.style, 'si pl'), p.name, isPlan && p.planId === planId, p.enabled ? '' : '未上架', !!this._pdDraft[p.planId])).join('')}
      <h5>頁尾</h5>${navItem('#/admin/settings/content/footer', `<span class="si">${ic('link')}</span>`, '頁尾與聯絡連結', !isPlan && sec === 'footer', '', dirtySecs.includes('footer'))}</nav>`;
    const nDirty = dirtySecs.length + Object.keys(this._pdDraft).length;
    const def = isPlan ? null : CONTENT_SECTIONS.find(s => s.id === sec);
    const editor = isPlan ? this.planEditor(plan, x) : this.secEditor(def, x);
    const html = this.shell({ title: '網站內容', mirror: isPlan ? '方案介紹頁・首頁 方案介紹' : def.mirror, sub: nDirty ? `<span class="dn">${nDirty} 個區塊有未儲存的變更</span>` : '儲存後前台立即更新', actions: `<a class="btn ghost sm" href="#/${isPlan ? 'plans/' + planId : ''}" target="_blank" rel="noopener">${ic('eye')}<span>預覽網站</span></a><button class="btn ghost sm show-t" data-pvopen>${ic('phone')}<span>預覽</span></button>` }, `
      <div class="ce">${snav}
        <div class="ce-ed">${editor}</div>
        <aside class="card ce-pv"><header class="ch"><h3>預覽</h3><span class="sub">${isPlan ? '方案介紹頁' : U.esc(def.mirror)}</span><div class="r"><div class="seg xs" role="tablist"><button class="on" data-pvm="m">手機</button><button data-pvm="d">電腦</button></div></div></header><div class="cb"><div class="pvf m" data-pvbox></div><p class="mnote c">示意預覽・實際樣式以前台為準</p></div></aside>
      </div>`);
    this.mount(root, html, r => {
      const ed = r.querySelector('.ce-ed');
      const pv = () => { const box = r.querySelector('[data-pvbox]'); box.innerHTML = isPlan ? this.pvPlan(plan, this.pdValues(plan.planId, x)) : this.pvSection(def, this.secValues(def, x)); AUI.paint(box); };
      r.querySelectorAll('[data-pvm]').forEach(b => b.addEventListener('click', () => { r.querySelectorAll('[data-pvm]').forEach(y => y.classList.toggle('on', y === b)); r.querySelector('[data-pvbox]').className = 'pvf ' + b.dataset.pvm; }));
      r.querySelector('[data-pvopen]').addEventListener('click', () => modal({ title: '預覽', html: `<div class="pvf m">${isPlan ? this.pvPlan(plan, this.pdValues(plan.planId, x)) : this.pvSection(def, this.secValues(def, x))}</div>`, cancel: '關閉', onOpen: sc => AUI.paint(sc) }));
      if (isPlan) this.bindPlanEditor(ed, plan, x, pv); else this.bindSecEditor(ed, def, x, pv);
      pv();
    });
  },
  contentDirtySections() { const keys = Object.keys(this._cDraft); return CONTENT_SECTIONS.filter(s => s.fields.some(f => keys.includes(f.k))).map(s => s.id); },
  secValues(def, x) { const o = {}; def.fields.forEach(f => { o[f.k] = f.k in this._cDraft ? this._cDraft[f.k] : x.content[f.k]; }); return o; },
  lastUpd(keys, meta) { let best = null; keys.forEach(k => { const m = meta && meta[k]; if (m && m.updatedAt && (!best || m.updatedAt > best.updatedAt)) best = m; }); return best ? `最後更新 <span class="num">${U.dot(best.updatedAt.slice(0, 10))}</span>${best.updatedBy ? ' 由 ' + U.esc(best.updatedBy) : ''}` : '尚未修改過，目前為預設內容'; },
  fieldHtml(f, v) {
    if (f.t === 'bool') return `<div class="setrow ${f.half ? 'half' : ''}"><span class="t"><b>${U.esc(f.l)}</b>${f.sub ? `<small>${U.esc(f.sub)}</small>` : ''}</span>${AUI.sw(v !== false && v !== 'FALSE', `data-ck="${f.k}"`, f.l)}</div>`;
    if (f.t === 'facts') return `<div class="fld"><span class="lbl"><span>${U.esc(f.l)}</span><small>${U.esc(f.hint || '')}</small></span>${AUI.list(f.k, [{ k: 'a', ph: '名稱', max: 8 }, { k: 'b', ph: '內容', max: 30, flex: 2 }], (Array.isArray(v) ? v : []).map(p => ({ a: p[0], b: p[1] })), { max: 4 })}</div>`;
    if (f.t === 'list') return `<div class="fld"><span class="lbl"><span>${U.esc(f.l)}</span><small data-lc="${f.k}">${(v || []).length} 項・拖曳排序</small></span>${f.hint ? `<p class="mnote">${U.esc(f.hint)}</p>` : ''}${AUI.list(f.k, f.cols, Array.isArray(v) ? v : [], { max: f.max, wrap: f.wrap, addLabel: f.add })}</div>`;
    return AUI.field({ key: f.k, label: f.l, max: f.max, value: v, type: f.t === 'text' ? 'textarea' : 'text', ph: f.ph || '', cls: f.half ? 'half' : '', help: f.hint ? U.esc(f.hint) : '', rows: 3 });
  },
  secEditor(def, x) {
    const v = this.secValues(def, x);
    const dirty = def.fields.some(f => f.k in this._cDraft);
    return `<section class="card ed" data-sec="${def.id}"><header class="ch"><span class="si">${ic(def.icon)}</span><h3>${U.esc(def.name)}</h3>${AUI.mirror(def.mirror)}${dirty ? '<span class="r"><span class="mark none">未儲存</span></span>' : ''}</header>
      <div class="cb fgrid">${def.fields.map(f => this.fieldHtml(f, v[f.k])).join('')}
      ${def.plansList ? `<div class="fld"><span class="lbl"><span>方案內容</span><small>情境問句、探索內容等在各方案編輯</small></span><ul class="plinks">${x.plans.map(p => `<li><a href="#/admin/settings/content/plan/${p.planId}">${AUI.pl(p.style, 'pl')}<b>${U.esc(p.name)}</b><small>${U.esc((x.planDetails[p.planId] || {}).question || p.tagline || '')}</small>${p.enabled ? '' : '<span class="mark off">未上架</span>'}${ic('right')}</a></li>`).join('')}</ul></div>` : ''}
      ${this.varChips('site')}<div data-varbox></div></div>
      <footer class="cf"><span class="meta">${this.lastUpd(def.fields.map(f => f.k), x.meta)}</span><button class="btn ghost" data-revert ${dirty ? '' : 'disabled'}>還原</button><button class="btn pri" data-save>${ic('check')}儲存</button></footer></section>`;
  },
  readField(ed, f) {
    if (f.t === 'bool') return AUI.swOn(ed.querySelector(`[data-ck="${f.k}"]`));
    if (f.t === 'facts') { const le = ed.querySelector(`[data-le="${f.k}"]`); return AUI.listGet(le, [{ k: 'a' }, { k: 'b' }]).map(o => [o.a, o.b]); }
    if (f.t === 'list') return AUI.listGet(ed.querySelector(`[data-le="${f.k}"]`), f.cols);
    const i = ed.querySelector(`[data-k="${f.k}"]`); return i ? i.value : '';
  },
  bindSecEditor(ed, def, x, pv) {

const TAROT_TABS = [['pending', '待解讀'], ['codes', '代碼管理'], ['records', '占卜紀錄'], ['cards', '牌義內容']];
const trKindChip = k => `<span class="tr-kind ${k}">${U.esc((TAROT_CODE_KINDS[k] || ['—'])[0])}</span>`;

/* 讀檔成 base64（上傳到 Google 雲端；展示模式只存 1.5 MB 以下的內容） */
function readFileB64(file) { return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result)); fr.onerror = () => no(new ApiError('BAD_REQUEST', '無法讀取檔案')); fr.readAsDataURL(file); }); }
async function uploadFiles(files, ownerType, ownerId) {
  let n = 0;
  for (const f of Array.from(files || [])) {
    if (!RP_FILE_TYPES.includes(f.type)) { toast(f.name + '：只能上傳 PDF、JPG、PNG', 'err'); continue; }
    if (f.size > RP_FILE_MAX) { toast(f.name + '：超過 10 MB，請壓縮後再上傳', 'err'); continue; }
    try { const data = await readFileB64(f); const x = await api.call('adminUploadFile', { ownerType, ownerId, name: f.name, type: f.type, size: f.size, data }); n++; if (x.demoNoPreview) toast('展示模式只保存 1.5 MB 以下的檔案內容，正式版沒有這個限制'); } catch (e) { errToast(e); }
  }
  if (n) toast(`已上傳 ${n} 個檔案`, 'ok');
  return n;
}

function bindDrop(r, id, onFiles) {

/* ===================== 網站 B「Mia 陪伴」陪伴後台 ===================== */
/* 沿用預約後台的外框、登入、塔羅四頁與總結報告（R1）；這裡換成 B 的選單、路由，加上今日陪伴、客戶旅程 */
const CARE_FRONT = IS_DEMO ? '展示_陪伴網站.html' : (CFG.CARE_URL || './');
const CARE_MAIN_ADMIN = (CFG.MAIN_URL || 'https://psnw0925-creator.github.io/mia-booking/') + 'admin.html#/admin';
const CARE_STEPS = [['24h', 1, '24 小時關心'], ['72h', 3, '72 小時關心'], ['7d', 7, '第 7 天關心']];
const CARE_REPORT_DAY = 10;
const careNoteText = (label, bookingId) => `【已關心】${label}・${bookingId}`;
/* 報告檔案下載期限：第一次發送日 +30 天 23:59（後端有 downloadUntil 就用） */
function careUntil(r) {
  if (!r || !r.sentAt) return '';
  if (r.downloadUntil) return r.downloadUntil;
  const f = r.firstSentAt || ((r.log || []).find(l => l.kind === 'send') || {}).ts || r.sentAt;
  return U.addDays(f.slice(0, 10), 30) + 'T23:59:59+08:00';
}
function careDlCard(r) {
  const u = careUntil(r); if (!u) return '';
  const exp = u < U.iso();
  return `<section class="card"><header class="ch"><h3>檔案下載期限</h3><span class="st ${exp ? 's-noshow' : 's-check'}">${exp ? '已失效' : '有效'}</span></header><div class="cb"><p class="mnote">第一次發送後算到第 30 天 23:59，重新發送不會延長。</p><p class="num" style="font-size:15px;margin:6px 0 0"><b>${U.dot(u.slice(0, 10))} 23:59</b>${exp ? '・客人已無法下載' : `・還有 ${Math.max(0, U.diffDays(U.today(), u.slice(0, 10)))} 天`}</p><p class="mnote">管理員不受期限限制。</p></div></section>`;
}

/* ---------- 選單（S3 設計稿：今日陪伴・陪伴追蹤・塔羅・客人・設定） ---------- */
NAV.length = 0;
NAV.push(['今日陪伴', 'grid', ''], ['陪伴追蹤', 'heart', 'companions'], ['塔羅', 'moon', 'tarot'], ['客人', 'people', 'customers'], ['設定', 'gear', 'settings']);
const CARE_CLIENT_TABS = [['customers', '客戶追蹤'], ['dormant', '久未回訪'], ['feedback', '反饋紀錄']];
/* 測試紀錄（source 以 test 開頭）在名字旁加「測試」小標籤 */
function careTestTag(b) { return b && /^test/.test(String(b.source || '')) ? ' <span class="st s-check tst-tag">測試</span>' : ''; }
const CARE_SET_TABS = [['templates', '通知訊息'], ['features', '功能開關'], ['site', '價格與網址']];

Object.assign(Admin, {
  async route(h, root) {
    const path = AUI.path(); const sub = path[1] || '';
    if (sub === 'login') return this.loginView(root);
    if (!Session.token()) return App.go('#/admin/login');
    const u = Session.user();
    if (!u || !u.isAdmin) { try { const r = await api.call('authMe'); Session.setUser(r.user); if (!r.user.isAdmin) return App.go('#/admin/login'); } catch (e) { return App.go('#/admin/login'); } }
    let fn = '', key = sub, rest = path.slice(2);
    if (sub === '') { fn = 'care_today'; this.sec = ''; }
    else if (sub === 'companions') { fn = 'companions'; this.sec = 'companions'; }
    else if (sub === 'tarot') { const t = TAROT_TABS.find(x => x[0] === path[2]) ? path[2] : 'pending'; this.ttab = t; key = 'tarot/' + t; rest = path.slice(3); fn = 'tr_' + t; this.sec = 'tarot'; }
    else if (CARE_CLIENT_TABS.some(x => x[0] === sub)) { fn = 'care_' + sub; this.ctab = sub; this.sec = 'customers'; }
    else if (sub === 'settings') { const t = CARE_SET_TABS.find(x => x[0] === path[2]) ? path[2] : 'templates'; this.stab = t; key = 'settings/' + t; fn = 'care_set_' + t; this.sec = 'settings'; }
    if (!fn || typeof this[fn] !== 'function') return App.go('#/admin');
    if (key !== this.sub) { this._tplDraft = null; this.sel.clear(); }
    this.sub = key; AUI.closePops(); try { if (document.querySelector('.dw-scrim')) AUI.closeDrawer(); } catch (e) { }
    await this.payMode();
    const rid = this._rid = (this._rid || 0) + 1;

  /* ---------- 今日陪伴：照陪伴流程排今天要做的事 ---------- */
  async careTodayData() {
    const [cp, pend, codes] = await Promise.all([api.call('adminGetCompanions'), api.call('adminTarotPending'), api.call('adminTarotCodes', { kind: 'post' }).catch(() => ({ items: [] }))]);
    const T = U.today(), feat = this._feat || {}, items = cp.items || [];
    const sent = x => feat.report ? ['sent', 'opened', 'acked'].includes((x.report || {}).state) : !!x.reportSent;
    const codeOf = id => (codes.items || []).filter(c => c.bookingId === id).sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0] || null;
    const pendOf = id => pend.items.find(r => r.bookingId === id && r.codeKind === 'post');
    /* 總結報告：服務後第 10 天交付；前一天先列在「明天要交」 */
    const reports = items.filter(x => !sent(x)).map(x => {
      const b = x.booking, due = U.addDays(b.date, CARE_REPORT_DAY), dd = U.diffDays(T, due);
      if (dd > 1) return null;
      const c = codeOf(b.bookingId), st = c ? (c.state || trCodeState(c)) : '', pr = pendOf(b.bookingId);
      const full = !feat.tarot ? '' : !c ? (T >= U.addDays(b.date, 7) ? '全能量代碼還沒送出' : '') : st === '未使用' ? `全能量：代碼還沒使用（${U.tsLabel(c.expiresAt).slice(5)} 到期）` : st === '已過期' ? '全能量：代碼已過期未抽・報告不含全能量' : pr ? '全能量：已抽完・解牌待寫進報告' : '全能量：已抽完';
      return { x, b, due, dd, full };
    }).filter(Boolean).sort((a, b) => a.dd - b.dd);
    /* 關心：服務後第 1、3、7 天，Mia 親自在 LINE 傳，回來按「已關心」 */
    const care = []; const apiCare = items.some(x => x.care !== undefined);
    items.forEach(x => { const b = x.booking; CARE_STEPS.forEach(([k, n, label]) => { const due = U.addDays(b.date, n); if (due <= T && due >= U.addDays(T, -3) && due <= (x.endDate || T)) care.push({ x, b, k, label, due, doneAt: apiCare ? ((x.care || {})[k] || '') : null }); }); });
    if (!apiCare && care.length) {   /* 後端還沒有「已關心」欄位：讀跟進備註判斷 */
      const uids = [...new Set(care.map(c => c.b.lineUserId).filter(Boolean))];
      const js = await Promise.all(uids.map(uid => api.call('adminCustomerJourney', { lineUserId: uid }).catch(() => null)));
      const notes = {}; uids.forEach((uid, i) => { notes[uid] = (js[i] && js[i].notes) || []; });
      care.forEach(c => { const n = (notes[c.b.lineUserId] || []).find(z => String(z.text || '').indexOf(careNoteText(c.label, c.b.bookingId)) === 0); c.doneAt = n ? n.createdAt : ''; });
    }
    const careTodo = care.filter(c => !c.doneAt || c.doneAt.slice(0, 10) === T).sort((a, b) => (!!a.doneAt - !!b.doneAt) || a.due.localeCompare(b.due));
    /* 全能量：待解讀（服務後的寫進報告）＋服務後代碼 24 小時內到期還沒用 */
    const soon = (codes.items || []).filter(c => (c.state || trCodeState(c)) === '未使用' && c.expiresAt > U.iso() && (new Date(c.expiresAt) - Date.now()) < 864e5);
    /* 報告發送 3 天未確認 */
    const unack = items.filter(x => feat.report && ['sent', 'opened'].includes((x.report || {}).state) && x.report.sentAt && U.diffDays(x.report.sentAt.slice(0, 10), T) >= 3);
    const counts = { reports: reports.filter(r => r.dd <= 0).length, tomorrow: reports.filter(r => r.dd === 1).length, full: pend.items.length + soon.length, care: careTodo.filter(c => !c.doneAt).length, unack: unack.length };
    counts.total = counts.reports + counts.care + pend.items.filter(r => r.codeKind === 'post' || (r.daysLeft != null && r.daysLeft <= 0)).length + soon.length + counts.unack;
    return { reports, careTodo, apiCare, pend, soon, unack, counts };

        : `<select class="inp sm" data-plan aria-label="方案">${(x.plans || []).map(p => `<option value="${U.esc(p.planId)}">${U.esc(p.name)}</option>`).join('')}</select><button class="btn pri sm" data-create>建立測試服務紀錄</button>`;
      if (k === 'report') return b ? `<a class="btn ${isNow ? 'pri' : 'ghost'} sm" href="#/admin/companions/${encodeURIComponent(b.bookingId)}">打開這一筆的報告</a>` : '';
      const need = (k === 'remind' || k === 'expire') && !hasRp;
      let h = btn(k, done ? '重跑這一站' : '快轉', isNow && !need, !b || need);
      if (k === 'post' && done) h = `<a class="btn pri sm" href="#/admin/tarot/pending${x.post && x.post.readingId ? '/' + encodeURIComponent(x.post.readingId) : ''}">打開待解讀</a>` + h;
      if (need && b) h += '<small class="muted">第 3 站發送後才能按</small>';
      return h;
    };
    const rows = CARE_TEST_ST.map(([k, t, ex], i) => { const s = S[k] || {}, cls = s.done ? 'done' : k === nowK && (b || k === 'create') ? 'now' : ''; return `<div class="tst-row ${cls}"><span class="n num">${s.done ? ic('check') : i}</span><span class="t"><b>${t}</b>${s.info ? `<small>${U.esc(s.info)}</small>` : ''}</span><span class="ex">${ex}</span><span class="a">${act(k)}</span></div>`; }).join('');
    const top = b ? `<div class="tst-bk"><span class="st s-check">測試</span><b>${U.esc(b.name)}</b><span>${U.esc(b.planName || '')}・服務日 <span class="num">${U.dot(b.date).slice(5)}</span>（已快轉 ${x.day || 0} 天）</span><span class="muted r">LINE 已送 <b class="num">${x.sent || 0}</b> 則</span></div>` : '';
    const html = this.shell({ title: '設定' }, `
      <div class="tst-h"><h2 class="serif">流程測試・服務完成之後</h2><button class="btn ghost sm" data-clear ${b ? '' : 'disabled'}>清除測試資料</button></div>
      <p class="note info">${ic('spark')}<span>這裡測網站 B：服務完成之後。會建立一筆只給你自己的測試紀錄，每按一次快轉只移動這一筆的日期；真實客人與系統時間都不受影響。電腦按按鈕，手機用 LINE 當客人。LINE 訊息會真的送到你的 LINE（完整一輪約 6–8 則）。</span></p>
      ${warn.map(w => `<p class="note warn">${ic('bell')}<span>${U.esc(w)}</span></p>`).join('')}
      ${top}
      <section class="card flush tst"><div class="tst-hd"><span></span><span>這一站</span><span>手機上應該看到</span><span></span></div>${rows}</section>
      <p class="mnote">網站 A 的流程測試（預約 → 訂金 → 行前提醒 → 當日提醒 → 服務完成）在預約後台，和這裡的測試資料分開，互不影響。</p>`);
    const go = async (data, busyEl) => {
      if (busyEl) busyEl.disabled = true;
      try { const r = await api.call('adminTestRun', Object.assign({ site: 'b' }, data)); toast(r.msg || '完成', 'ok'); this._badges = null; this.bust(); this.rerender(); }
      catch (e) { errToast(e); if (busyEl) busyEl.disabled = false; }
    };
    this.mount(root, html, r => {
      const c = r.querySelector('[data-create]'); if (c) c.addEventListener('click', () => go({ op: 'create', planId: (r.querySelector('[data-plan]') || {}).value || '' }, c));
      r.querySelectorAll('[data-step]').forEach(bt => bt.addEventListener('click', () => go({ op: 'step', step: bt.dataset.step }, bt)));
      const cl = r.querySelector('[data-clear]'); if (cl) cl.addEventListener('click', async () => {
        if (!await confirmBox('清除測試資料', '<p>會刪除網站 B 的這筆測試紀錄，以及它的全能量代碼、占卜、總結報告與檔案。<b>無法復原</b>，確定嗎？</p><p class="mnote">真實客人的資料不受影響。</p>', '清除', true)) return;
        go({ op: 'clear' }, cl);
      });
    });
  },

  /* ---------- 塔羅 › 占卜紀錄：一般占卜只顯示 5 項（主題、問題、身分、好友、時間） ---------- */
  async tr_records(root) {
    const F = this._trrF || (this._trrF = { q: AUI.q().q || '', spread: '', page: 1, pageSize: 50 });
    if (AUI.q().q && AUI.q().q !== F.q) { F.q = AUI.q().q; F.page = 1; }
    const x = await api.call('adminTarotRecords', F);
    const short = r => r.kind === 'short';
    const cards = r => r.spread === 'full' ? `<span class="muted">12 大＋36 小</span>` : `<span class="tr-th sm">${(r.cards || []).map(id => `<img src="cards/${U.esc(id)}.jpg" alt="${U.esc(TAROT_NAMES[id])}" title="${U.esc(TAROT_NAMES[id])}" loading="lazy" onerror="this.style.visibility='hidden'">`).join('')}</span>`;
    const st = r => r.spread === 'full' ? `<span class="st ${(TR_READ_ST[r.status] || [])[1] || ''}">${(TR_READ_ST[r.status] || [r.status])[0]}</span>` : r.booked ? '<span class="st s-full">已預約療癒</span>' : '';
    const keep = x.keepHours || 24;
    const row = r => short(r)
      ? `<tr class="tr-short"><td class="num">${U.tsLabel(r.createdAt).slice(5)}</td><td><b>${U.esc(r.userName || r.name || '—')}</b></td><td>${U.esc(TAROT_TOPICS[r.topic] || '—')}</td><td class="tr-q"><span>${U.esc(r.question || '')}</span></td><td>${U.esc(CARE_ID_L[r.identity] || '—')}</td><td></td></tr>`
      : `<tr class="tr-row" data-rid="${U.esc(r.id)}" tabindex="0"><td class="num">${U.tsLabel(r.createdAt).slice(5)}<small>${U.esc(r.id)}</small></td><td><b>${U.esc(r.userName)}</b></td><td>${r.spread === 'full' ? '全能量檢測' : U.esc(TAROT_TOPICS[r.topic] || '')}</td><td class="tr-q">${r.spread === 'full' ? `<small>代碼 ${U.esc(r.code)}・${(TAROT_CODE_KINDS[r.codeKind] || ['—'])[0]}</small>` : `<span>${U.esc(r.question)}</span><small>${U.esc((TAROT_SPREADS[r.spread] || {}).n || '')}</small>`}</td><td>${r.spread === 'full' ? '' : U.esc(CARE_ID_L[r.identity] || '—')}</td><td><span class="tr-st">${cards(r)}${st(r)}</span></td></tr>`;
    const html = this.shell({ title: '塔羅', sub: `共 ${x.total} 筆・一般占卜 ${keep} 小時後只保留主題、問題、身分、好友、時間；全能量與帶去預約的完整保留` }, `
      <section class="card flush"><header class="ch tr-fil">
        <div class="seg sm">${[['', '全部'], ['full', '全能量']].map(([k, l]) => `<button class="${F.spread === k ? 'on' : ''}" data-sp="${k}">${l}</button>`).join('')}</div>
        <input class="inp" data-q placeholder="搜尋姓名、問題、代碼" value="${U.esc(F.q)}"></header>
        <div class="tw"><table class="tb"><thead><tr><th>時間</th><th>哪一位好友</th><th>主題</th><th>問題</th><th>身分</th><th>牌・狀態</th></tr></thead><tbody>
        ${x.items.length ? x.items.map(row).join('') : `<tr class="none-r"><td colspan="6">${AUI.empty('沒有符合的占卜紀錄')}</td></tr>`}
        </tbody></table></div>${x.total > F.pageSize ? `<div class="pg-wrap">${pager({ page: F.page, pageSize: F.pageSize }, x.total, (p, ps) => { F.page = p; F.pageSize = ps; this.rerender(); })}</div>` : ''}</section>
      <p class="mnote">一般占卜（沒有帶去預約）只列 5 項，不顯示牌與牌陣；全能量檢測、已帶去「塔羅療癒專屬方案」預約的可以點開看完整內容。</p>`);
    this.mount(root, html, r => {
      r.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => { F.spread = b.dataset.sp; F.page = 1; this.rerender(); }));
      const q = r.querySelector('[data-q]'); q.addEventListener('input', AUI.debounce(() => { F.q = q.value; F.page = 1; AUI.replace('#/admin/tarot/records'); this.rerender().then(() => this.refocus('[data-q]')); }, 350));
      const open = id => { const it = x.items.find(z => z.id === id); if (!it || short(it)) return; if (it.spread === 'full') return App.go('#/admin/tarot/pending/' + id); this.trDrawer(it); };
      r.querySelectorAll('[data-rid]').forEach(tr => { tr.addEventListener('click', () => open(tr.dataset.rid)); tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(tr.dataset.rid); }); });
    });
  }
});

boot();

</script>
</body>
</html>
