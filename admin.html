  --fs-20: 20px; --fs-24: 24px; --fs-28: 28px; --fs-34: 34px; --fs-44: 44px;
  --lh-tight: 1.25; --lh-body: 1.7; --lh-loose: 1.9;
  --ls-wide: .08em; --ls-caps: .2em;

  /* ink (text) — same family in both scopes */
  --ink: #0F1E3C; --ink-2: #2A3F66; --ink-3: #3C5279; --ink-4: #6A7A9C;
  --deep: #1F3D78; --deep-2: #2C5598;          /* primary action blue */
  --baby: #A9CDF2; --baby-2: #D6ECFA;

  /* semantic */
  --ok: #2E9C95; --ok-bg: #DDF3F1; --ok-ink: #1F6F69;
  --warn: #D9A441; --warn-bg: #FFF0D6; --warn-ink: #94621C;
  --danger: #C25A44; --danger-bg: #F6DAD3; --danger-ink: #A0482F;
  --info-bg: #DCEBFA; --info-ink: #2F5F9A;
  --line-green: #06C755;

  /* plan palettes (planet mid/lo + tag bg/ink). style ids = Plans.style */
  --pl-money-hi: #FFF6EC; --pl-money-mid: #F7CDB2; --pl-money-lo: #B9849A; --pl-money-tag: #FDE9DE; --pl-money-ink: #9A5434;
  --pl-talent-hi: #F8F2FF; --pl-talent-mid: #C9B8F2; --pl-talent-lo: #6E63AE; --pl-talent-tag: #E3E9FC; --pl-talent-ink: #3E52A3;
  --pl-rel-hi: #F3FBFF; --pl-rel-mid: #A9D6FA; --pl-rel-lo: #4A78B4; --pl-rel-tag: #D6ECFA; --pl-rel-ink: #2F5F9A;
  --pl-love-hi: #FFF3F8; --pl-love-mid: #F2BCD6; --pl-love-lo: #8E6AA6; --pl-love-tag: #ECE4FA; --pl-love-ink: #5B4BA6;
  --pl-check-hi: #F0FFFC; --pl-check-mid: #A6E3DE; --pl-check-lo: #3F8A9E; --pl-check-tag: #DCEFF2; --pl-check-ink: #2E6475;
  --pl-custom1-hi: #F4F7FF; --pl-custom1-mid: #AFC0F2; --pl-custom1-lo: #4B5BA6; --pl-custom1-tag: #E6EAFB; --pl-custom1-ink: #3E4C9A;
  --pl-custom2-hi: #FFF8F0; --pl-custom2-mid: #F5D9A8; --pl-custom2-lo: #A07A62; --pl-custom2-tag: #FBEEDC; --pl-custom2-ink: #8A5A2C;
  --pl-custom3-hi: #F2FFF8; --pl-custom3-mid: #B4E6CC; --pl-custom3-lo: #4A8A86; --pl-custom3-tag: #DEF4EA; --pl-custom3-ink: #2F6E5C;
  --pl-custom4-hi: #EFF9FF; --pl-custom4-mid: #8FCBEF; --pl-custom4-lo: #2F6A9E; --pl-custom4-tag: #DBEEFC; --pl-custom4-ink: #27598A;
  --pl-custom5-hi: #FFF4F2; --pl-custom5-mid: #F4BFB4; --pl-custom5-lo: #9A6077; --pl-custom5-tag: #FBE4E0; --pl-custom5-ink: #8A4A5C;
  --pl-custom6-hi: #FBF7FF; --pl-custom6-mid: #D9C9F5; --pl-custom6-lo: #6C5C9E; --pl-custom6-tag: #EDE6FA; --pl-custom6-ink: #5A4A8C;
  --pl-custom7-hi: #FFFFFF; --pl-custom7-mid: #C8D8EA; --pl-custom7-lo: #53698E; --pl-custom7-tag: #E6EDF6; --pl-custom7-ink: #46587F;
  /* hero pearl planet */
  --pl-pearl-hi: #FFFFFF; --pl-pearl-mid: #C4DAF3; --pl-pearl-lo: #56709F;

  /* radii / motion / z */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;
  --ease: cubic-bezier(.2,.7,.2,1); --t-fast: .15s; --t-med: .25s; --t-slow: .45s;
  --z-sky: -1; --z-header: 40; --z-tabbar: 50; --z-sheet: 60; --z-modal: 70; --z-toast: 90;
  --gutter: 16px;                 /* phone side gutter */
  --wrap: 1200px;                 /* desktop content width */
  --tabbar-h: 66px; --tabbar-gap: 12px;
  --hdr-h: 76px; --hdr-h-m: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
/* Breakpoints (reference — CSS cannot var() media queries; builders hard-code these values):
   phone   ≤ 760px      tablet 761–1100px      desktop > 1100px                                     */

/* ---------- 2. FRONT scope (C style) ---------- */
body.front {
  --bg0: #BFD3EA;
  --sky: radial-gradient(90% 70% at 75% 35%, #DCE8F6 0%, rgba(220,232,246,0) 60%),
         linear-gradient(172deg, #A9C2E0 0%, #BBD0E9 30%, #C9DAEE 62%, #C2D4EA 100%);
  --neb-1: #E9F2FC; --neb-2: #F6E9F3; --neb-3: #DDF2F4; --neb-4: #EDE8FB;
  --line: rgba(255,255,255,.55);          /* hairlines on glass */
  --line-ink: rgba(15,30,60,.22);         /* hairlines on sky */
  --line-ink-2: rgba(15,30,60,.35);
  --orbit: rgba(255,255,255,.6);
  --sel: #FFFFFF; --focus: #1F3D78;
  --glass-bg: linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,.16) 55%, rgba(255,255,255,.26));
  --glass-border: rgba(255,255,255,.7);
  --glass-blur: 26px;
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 40px rgba(255,255,255,.12), 0 30px 60px -36px rgba(20,40,90,.45);
  --glass-soft-bg: rgba(255,255,255,.28); /* inputs, slots, chips */
  --btn-radius: 4px; --btn-ls: .16em;
  --pri-bg: linear-gradient(180deg, #2A4C8C, #173264);
  --pri-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08), 0 14px 30px -14px rgba(15,30,70,.7);
  --card-radius: 16px;
  --tabbar-bg: rgba(232,240,250,.62);
  --orbbtn-bg: radial-gradient(circle at 35% 28%, #5E85C6, #1F3D78 60%, #122850);
  --slot-bg: rgba(255,255,255,.28); --slot-border: rgba(255,255,255,.9);
  --cal-open: rgba(255,255,255,.28); --cal-full: #7D90B0; --cal-off: #A9B9D1; --cal-sel: var(--ink);
  background: var(--bg0); color: var(--ink);
}
/* Star canvas config consumed by src/front-sky.js (read via getComputedStyle on body.front) */
body.front { --sky-density: 1.1; --sky-glint: .07; --sky-shoot-min: 4; --sky-shoot-max: 7; }

/* ---------- 3. ADMIN scope (light) ---------- */
body.admin {
  --bg: #F2F7FD;
  --bg-grad: radial-gradient(900px 500px at 85% -10%, rgba(198,226,253,.9), transparent 70%),
             radial-gradient(700px 500px at 30% 110%, rgba(232,222,255,.55), transparent 70%),
             linear-gradient(180deg, #EDF4FC, #F6F9FE);
  --card: #FFFFFF; --card-bg: rgba(255,255,255,.88);
  --line: #E2EAF5; --line-2: #D3DFEF;
  --sel: #D6E9FD; --focus: #3D6FC0;
  --ink: #14244A; --ink-2: #46587F; --ink-3: #6A7A9C;
  --side-w: 244px; --side-rail: 64px;
  --nav-on: linear-gradient(180deg, #5F92DB, #2C559A);
  --btn-radius: 10px; --btn-ls: .06em;
  --pri-bg: linear-gradient(180deg, #5F92DB, #2C559A);
  --pri-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 14px -6px rgba(44,85,152,.6);
  --card-radius: 18px;
  --card-shadow: 0 0 0 1px rgba(205,221,242,.6), 0 18px 40px -26px rgba(30,60,120,.35);
  --th-bg: #F6F9FD; --row-alt: rgba(246,249,253,.6); --row-sel: #EAF4FF;
  --load-bar: linear-gradient(90deg, #8FBBEA, #2C5598);
  background: var(--bg-grad) fixed, var(--bg); color: var(--ink);
}

/* ---------- 4. Reset + primitives (both scopes) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--font-sans); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
::selection { background: var(--sel); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0; }
.lat { font-family: var(--font-latin); font-weight: 500; }
.serif { font-family: var(--font-serif); font-weight: 600; letter-spacing: var(--ls-wide); }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: min(var(--wrap), 100% - var(--gutter) * 2); margin-inline: auto; }

/* planet host: <span class="pl" data-planet="rel"></span> painted by window.Planets.paint() */
[data-planet] { display: block; aspect-ratio: 1; }
[data-planet] svg { width: calc(100% * var(--k, 1)); max-width: none; height: auto; margin-left: calc((100% - 100% * var(--k, 1)) / 2); }

/* buttons: .btn + .pri | .ghost | .soft | .danger ; sizes .sm .lg ; .full */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: var(--btn-radius); font-size: var(--fs-15); font-weight: 600; letter-spacing: var(--btn-ls); white-space: nowrap; position: relative; isolation: isolate; transition: scale var(--t-fast) ease-out, box-shadow var(--t-med) ease-out, background-color var(--t-fast); }
.btn:not(:disabled):active { scale: .96; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 38px; padding: 0 16px; font-size: var(--fs-13); }
.btn.lg { height: 56px; padding: 0 30px; font-size: var(--fs-16); }
.btn.full { width: 100%; }
.btn .i { width: 18px; height: 18px; }
.btn.pri { color: #fff; background: var(--pri-bg); box-shadow: var(--pri-shadow); }
body.front .btn.pri::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.22); border-radius: 2px; pointer-events: none; }
body.front .btn.ghost { color: var(--ink); background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(12px); }
body.admin .btn.ghost, body.admin .btn.sec { background: #fff; border: 1px solid var(--line-2); color: var(--ink); box-shadow: 0 1px 2px rgba(20,36,74,.05); }
.btn.soft { background: var(--info-bg); color: var(--info-ink); }
.btn.danger { background: var(--danger-bg); color: var(--danger-ink); }
.btn.txt { height: auto; padding: 0; background: none; color: var(--deep); letter-spacing: .04em; }
.line-chip { font-family: var(--font-num); font-size: 10px; font-weight: 800; letter-spacing: .04em; background: var(--line-green); color: #fff; border-radius: 5px; padding: 1px 5px; line-height: 1.5; }

/* glass card (front) / light card (admin) — one class, two scopes */
body.front .card { background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)) saturate(130%); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(130%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--card-radius); }
body.admin .card { background: var(--card-bg); backdrop-filter: blur(14px); border: 1px solid #fff; border-radius: var(--card-radius); box-shadow: var(--card-shadow); }

/* status pills — codes from SPEC §3.5 */
.st { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--fs-12); font-weight: 700; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.s-unpaid { background: #EEF1F6; color: #5F708C; }
.st.s-check { background: var(--warn-bg); color: var(--warn-ink); }
.st.s-dep { background: #ECE6FB; color: #5B4BA6; }
.st.s-full { background: var(--ok-bg); color: #2C716B; }
.st.s-link { background: var(--info-bg); color: var(--info-ink); }
.st.s-done { background: #E9EEF4; color: #46587F; }
.st.s-noshow { background: var(--danger-bg); color: var(--danger-ink); }
.st.s-cancel { background: #F0F2F5; color: #8A97AB; }
body.front .st { background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.7); }

/* plan tag with planet dot: <span class="ptag p-rel"><i></i>關係型</span> */
.ptag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 4px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--tag, #EEF3FA); color: var(--tag-ink, var(--ink)); }
.ptag i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: radial-gradient(circle at 35% 30%, var(--hi, #fff), var(--mid, #C8D8EA) 60%, var(--lo, #53698E)); }
.p-money { --hi: var(--pl-money-hi); --mid: var(--pl-money-mid); --lo: var(--pl-money-lo); --tag: var(--pl-money-tag); --tag-ink: var(--pl-money-ink); }
.p-talent { --hi: var(--pl-talent-hi); --mid: var(--pl-talent-mid); --lo: var(--pl-talent-lo); --tag: var(--pl-talent-tag); --tag-ink: var(--pl-talent-ink); }
.p-rel { --hi: var(--pl-rel-hi); --mid: var(--pl-rel-mid); --lo: var(--pl-rel-lo); --tag: var(--pl-rel-tag); --tag-ink: var(--pl-rel-ink); }
.p-love { --hi: var(--pl-love-hi); --mid: var(--pl-love-mid); --lo: var(--pl-love-lo); --tag: var(--pl-love-tag); --tag-ink: var(--pl-love-ink); }
.p-check { --hi: var(--pl-check-hi); --mid: var(--pl-check-mid); --lo: var(--pl-check-lo); --tag: var(--pl-check-tag); --tag-ink: var(--pl-check-ink); }
.p-custom1 { --hi: var(--pl-custom1-hi); --mid: var(--pl-custom1-mid); --lo: var(--pl-custom1-lo); --tag: var(--pl-custom1-tag); --tag-ink: var(--pl-custom1-ink); }
.p-custom2 { --hi: var(--pl-custom2-hi); --mid: var(--pl-custom2-mid); --lo: var(--pl-custom2-lo); --tag: var(--pl-custom2-tag); --tag-ink: var(--pl-custom2-ink); }
.p-custom3 { --hi: var(--pl-custom3-hi); --mid: var(--pl-custom3-mid); --lo: var(--pl-custom3-lo); --tag: var(--pl-custom3-tag); --tag-ink: var(--pl-custom3-ink); }
.p-custom4 { --hi: var(--pl-custom4-hi); --mid: var(--pl-custom4-mid); --lo: var(--pl-custom4-lo); --tag: var(--pl-custom4-tag); --tag-ink: var(--pl-custom4-ink); }
.p-custom5 { --hi: var(--pl-custom5-hi); --mid: var(--pl-custom5-mid); --lo: var(--pl-custom5-lo); --tag: var(--pl-custom5-tag); --tag-ink: var(--pl-custom5-ink); }
.p-custom6 { --hi: var(--pl-custom6-hi); --mid: var(--pl-custom6-mid); --lo: var(--pl-custom6-lo); --tag: var(--pl-custom6-tag); --tag-ink: var(--pl-custom6-ink); }
.p-custom7 { --hi: var(--pl-custom7-hi); --mid: var(--pl-custom7-mid); --lo: var(--pl-custom7-lo); --tag: var(--pl-custom7-tag); --tag-ink: var(--pl-custom7-ink); }

/* form fields (shared shape; scope colours) */
.fld { display: grid; gap: 6px; margin-bottom: 14px; }
.fld .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-13); font-weight: 600; letter-spacing: .04em; }
.fld .lbl small { font-weight: 400; color: var(--ink-3); }
.fld .req { color: var(--danger); margin-left: 3px; }
.inp { width: 100%; height: 44px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--line-2, var(--line)); background: var(--inp-bg, #fff); color: var(--ink); transition: border-color var(--t-fast), box-shadow var(--t-fast); }
textarea.inp { height: auto; min-height: 110px; padding: 12px 14px; resize: vertical; line-height: 1.6; }
.inp:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(61,111,192,.18); }
.inp.err { border-color: var(--danger); }
.ferr { color: var(--danger-ink); font-size: var(--fs-13); min-height: 18px; }
body.front { --inp-bg: rgba(255,255,255,.55); --line-2: rgba(255,255,255,.9); }
.switch { width: 40px; height: 24px; border-radius: var(--r-pill); background: #C6D3E6; position: relative; transition: background var(--t-fast); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: translate var(--t-fast) var(--ease); }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { translate: 16px 0; }
.ck { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 0; font-size: var(--fs-14); line-height: 1.6; }
.ck .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-ink-2, var(--line-2)); display: grid; place-items: center; flex: none; margin-top: 1px; background: var(--inp-bg, #fff); }
.ck .box .i { width: 14px; height: 14px; stroke-width: 2.4; color: #fff; }
.ck.on .box { background: var(--deep); border-color: var(--deep); }

/* segmented tabs: <div class="seg"><button class="on">A<b>12</b></button>…</div> */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--seg-bg, rgba(255,255,255,.35)); border: 1px solid var(--seg-border, rgba(255,255,255,.7)); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 36px; padding: 0 16px; border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: 600; letter-spacing: .04em; white-space: nowrap; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }
.seg button b { font-family: var(--font-num); font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: var(--r-pill); background: rgba(20,40,80,.08); }
.seg button.on { background: var(--ink); color: #fff; }
.seg button.on b { background: rgba(255,255,255,.22); }
body.admin { --seg-bg: #EEF3FA; --seg-border: var(--line); }
body.admin .seg button.on { background: var(--deep-2); }
/* underline tabs (C plans category tabs / admin list status tabs) */
.utabs { display: flex; gap: 0; border-bottom: 1px solid var(--line-ink, var(--line)); overflow-x: auto; scrollbar-width: none; }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { height: 46px; padding: 0 2px; margin-right: 24px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink-3); font-size: var(--fs-14); letter-spacing: var(--ls-wide); white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.utabs button b { font-family: var(--font-num); font-size: 12px; font-weight: 600; opacity: .8; }
.utabs button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
body.admin .utabs button.on { border-bottom-color: var(--deep-2); }

/* pager: <nav class="pager"><span class="rng">第 1–50 筆／共 1,284 筆</span><select class="ps">…</select><button class="pg" …>1</button>…</nav> */
.pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-13); color: var(--ink-3); padding: 12px 0; }
.pager .rng { margin-right: auto; }
.pager .pg { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; color: var(--ink-2); border: 1px solid transparent; }
.pager .pg.on { background: var(--ink); color: #fff; }
body.admin .pager .pg.on { background: var(--deep-2); }
.pager .pg:disabled { opacity: .35; }
.pager .ps { height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line-2, var(--line)); background: var(--inp-bg, #fff); padding: 0 8px; }

/* load bar (admin month view / today capacity): <span class="load" style="--p:.6"><i></i></span> */
.load { display: block; height: 6px; border-radius: 3px; background: #E3EBF5; overflow: hidden; }
.load i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--load-bar, var(--deep)); border-radius: 3px; }
.mark { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 700; }
.mark.full { background: var(--deep-2); color: #fff; }
.mark.off { background: #EEF1F6; color: #6A7A9C; }
.mark.none { background: var(--warn-bg); color: var(--warn-ink); }

/* empty / skeleton */
.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); font-size: var(--fs-14); line-height: 1.8; }
.empty [data-planet] { width: 56px; margin: 0 auto 14px; opacity: .8; }
.skel { background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.55), rgba(255,255,255,.25)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: var(--r-md); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* toast / modal / sheet / scrim (implemented in app.js, styled here) */
#toasts { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; border-radius: var(--r-lg); padding: 11px 16px; box-shadow: 0 12px 30px -12px rgba(15,30,60,.6); display: flex; gap: 8px; align-items: center; animation: tin var(--t-med) ease-out; }
.toast.err { background: var(--danger-ink); }
.toast.ok { background: var(--ok-ink); }
.toast .i { width: 17px; height: 17px; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.scrim { position: fixed; inset: 0; background: rgba(15,30,60,.42); backdrop-filter: blur(4px); z-index: var(--z-modal); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fin .18s ease-out; }
@keyframes fin { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--modal-bg, #fff); color: var(--ink); border-radius: var(--r-xl); box-shadow: 0 40px 80px -30px rgba(15,30,60,.6); animation: pop var(--t-med) var(--ease); }
.modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
.modal .mh h3 { font-size: var(--fs-18); font-weight: 700; letter-spacing: .04em; }
.modal .mb { padding: 14px 20px; font-size: var(--fs-14); }
.modal .mf { display: flex; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }
.modal .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
body.front { --modal-bg: linear-gradient(160deg, #F4F8FD, #E6EEF8); }
@media (max-width: 760px) {
  .scrim { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: 92vh; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: var(--safe-b); animation: up var(--t-med) var(--ease); }
  .modal::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: rgba(20,40,80,.2); margin: 10px auto 0; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* demo badge (app.js) */
#demo-badge { position: fixed; left: 12px; bottom: calc(var(--tabbar-h) + var(--tabbar-gap) * 2 + var(--safe-b)); z-index: var(--z-sheet); height: 32px; padding: 0 12px 0 8px; border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 10px 24px -10px rgba(15,30,60,.7); }
#demo-badge .i { width: 14px; height: 14px; }

@media (min-width: 761px) { #demo-badge { bottom: 14px; } }
#demo-menu { position: fixed; left: 12px; bottom: calc(var(--tabbar-h) + var(--tabbar-gap) * 2 + 40px + var(--safe-b)); z-index: var(--z-sheet); background: #fff; color: var(--ink); border-radius: var(--r-lg); box-shadow: 0 20px 50px -20px rgba(15,30,60,.5); padding: 6px; min-width: 200px; display: grid; }
#demo-menu a, #demo-menu button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 600; text-align: left; }
#demo-menu a:hover, #demo-menu button:hover { background: #EEF3FA; }
#demo-menu .sep { height: 1px; background: #E2EAF5; margin: 4px 0; }
@media (min-width: 761px) { #demo-menu { bottom: 54px; } }

/* motion safety */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* ---- site.css ---- */
/* =====================================================================
   Mia v2 — front site (owner: Builder F). Direction C「珍珠星環」.
   Scoped under body.front; tokens come from tokens.css (never redefined here). Local vars prefixed --f-.
   Breakpoints: phone ≤760 · tablet 761–1100 · desktop >1100
   ===================================================================== */
body.front {
  --f-latin: "Cormorant Garamond", "GFS Baskerville", "TeX Gyre Pagella", Georgia, serif;
  --f-latnum: "Cormorant Garamond", "Noto Serif TC", "Noto Serif CJK TC", Georgia, serif;
  --f-hair: rgba(15, 30, 60, .22);
  --f-hair-2: rgba(15, 30, 60, .3);
  --f-soft: rgba(255, 255, 255, .28);
  --f-soft-2: rgba(255, 255, 255, .45);
  --f-ease: cubic-bezier(.2, 0, 0, 1);
  font-size: 16px;
  background: var(--bg0);
  scrollbar-color: rgba(31, 61, 120, .35) transparent;
}
body.front .lat { font-family: var(--f-latin); font-weight: 500; font-variant-numeric: lining-nums; }
/* numerals set in the display serif: always lining (Cormorant defaults to old-style; GFS Baskerville fallback has none) */
body.front .lat.num, body.front .num .lat, body.front .price .lat, body.front .slot, body.front .sum .tot .big, body.front .flow .fn, body.front .qo-k, body.front .acc-q .qn, body.front .cal-h b, body.front .wk-h b { font-family: var(--f-latnum); font-variant-numeric: lining-nums tabular-nums; }
body.front ::selection { background: #fff; color: var(--ink); }
body.front input, body.front textarea { caret-color: var(--deep); }
body:not(.front) .sky-host { display: none; }

/* ---------- sky layers ---------- */
.sky-host { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.sky-host .sky-bg { position: fixed; inset: 0; background: var(--sky); }
.sky-host .neb { position: fixed; inset: -20%; pointer-events: none; }
.sky-host .neb i { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--c) 0%, transparent 100%); will-change: transform; }
.sky-host .neb .n1 { --c: var(--neb-1); width: 60vmax; height: 60vmax; left: 12%; top: 14%; opacity: .75; --t: 70s; --dx: 6%; --dy: -5%; }
.sky-host .neb .n2 { --c: var(--neb-2); width: 44vmax; height: 44vmax; left: 70%; top: 30%; opacity: .55; --t: 56s; --dx: -7%; --dy: 4%; }
.sky-host .neb .n3 { --c: var(--neb-3); width: 46vmax; height: 46vmax; left: 24%; top: 66%; opacity: .5; --t: 60s; --dx: 6%; --dy: 4%; }
.sky-host .neb .n4 { --c: var(--neb-4); width: 56vmax; height: 56vmax; left: 62%; top: 76%; opacity: .55; --t: 62s; --dx: -7%; --dy: -5%; }
@media (prefers-reduced-motion: no-preference) {
  .sky-host .neb i { animation: f-drift var(--t, 46s) ease-in-out infinite alternate; }
  .sky-host .neb i:nth-child(2n) { animation-direction: alternate-reverse; }
}
@keyframes f-drift { 0% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.08); } 100% { transform: translate3d(calc(var(--dx) * -.6), calc(var(--dy) * -1), 0) scale(.96); } }
.sky-host canvas.sky { position: fixed; left: 0; top: 0; }

/* ---------- planet hosts ---------- */
body.front [data-planet] { display: grid; align-content: center; }

/* ---------- typography + shared bits ---------- */

body.front .tlink { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; letter-spacing: .12em; font-size: 15px; border-bottom: 1px solid rgba(15, 30, 60, .4); padding-bottom: 3px; transition: border-color var(--t-fast), color var(--t-fast); white-space: nowrap; }

const TZ = (window.MIA_CONFIG && MIA_CONFIG.TIMEZONE) || 'Asia/Taipei';
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const U = {
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  pad(n) { return String(n).padStart(2, '0'); },
  nowParts(d) {
    d = d || new Date();
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(d);
    const o = {}; p.forEach(x => o[x.type] = x.value);
    return { date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour}:${o.minute}`, sec: o.second };
  },
  today() { return U.nowParts().date; },
  nowMin() { const t = U.nowParts().time; return U.toMin(t); },
  iso(d) { const p = U.nowParts(d); return `${p.date}T${p.time}:${p.sec}+08:00`; },
  toMin(t) { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; },
  fromMin(m) { return U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60); },
  addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d + n)); return dt.toISOString().slice(0, 10); },
  dow(ds) { const [y, m, d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); },
  diffDays(a, b) { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5); },
  dateLabel(ds, withYear) { if (!ds) return ''; const [y, m, d] = ds.split('-'); return `${withYear ? y + '.' : ''}${m}.${d}（${WD[U.dow(ds)]}）`; },
  dot(ds) { return ds ? ds.replace(/-/g, '.') : ''; },
  tsLabel(iso) { if (!iso) return ''; return iso.slice(0, 10).replace(/-/g, '.') + ' ' + iso.slice(11, 16); },
  money(n) { return 'NT$' + Number(n || 0).toLocaleString('en-US'); },
  monthStart(ds) { return ds.slice(0, 8) + '01'; },
  monthEnd(ds) { const [y, m] = ds.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); },
  addMonths(ds, n) { const [y, m] = ds.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1 + n, 1)); return dt.toISOString().slice(0, 10); },
  weekStart(ds) { const w = U.dow(ds); return U.addDays(ds, w === 0 ? -6 : 1 - w); }, // Monday
  rid(n) { const a = new Uint8Array(n || 12); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256 | 0); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
  ls: {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  },
  ss: {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return U.ss._m[k] || null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { U.ss._m[k] = v; } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete U.ss._m[k]; } },
    _m: {}
  }
};

/* groupSlots(slots, taken?) — slots = open start times; taken (optional) = held start times (DayAvail.taken).

    const range = list.length > 1 ? list[0] + '–' + list[list.length - 1] : list.length ? list[0] : '';

function varCheck(text, scope, tplKey) {
  const out = { errors: [], infos: [] }; const s = String(text == null ? '' : text); if (s.indexOf('{') < 0 && s.indexOf('}') < 0) return out;
  const defs = VAR_DEFS[scope] || [];
  const okHere = d => !d.only || d.only.indexOf(tplKey || '') >= 0;
  s.split('\n').forEach((line, li) => {
    let open = -1;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '{') { if (open >= 0) { out.errors.push({ type: 'brace', line: li + 1, name: line.slice(open, i), msg: `第 ${li + 1} 行的「${line.slice(open, i)}」少了右括號 }` }); } open = i; }
      else if (ch === '}') {
        if (open < 0) { out.errors.push({ type: 'brace', line: li + 1, name: '}', msg: `第 ${li + 1} 行多了一個右括號 }，或少了左括號 {` }); continue; }
        const name = line.slice(open + 1, i).trim(); open = -1;
        const d = defs.find(x => x.k === name), al = defs.find(x => (x.alias || []).indexOf(name) >= 0);
        if (d && okHere(d)) continue;
        if (al && okHere(al)) { out.infos.push({ type: 'old', line: li + 1, name, suggest: al.k, msg: `{${name}} 是舊名稱，建議改用 {${al.k}}` }); continue; }
        if (d || al) { out.errors.push({ type: 'scope', line: li + 1, name, msg: `{${name}} 只能用在「${(d || al).onlyLabel || ((d || al).only || []).map(k => TPL_NAME[k] || k).join('、')}」` }); continue; }
        const other = Object.keys(VAR_DEFS).find(sc => sc !== scope && VAR_DEFS[sc].some(x => x.k === name || (x.alias || []).indexOf(name) >= 0));
        if (other) { out.errors.push({ type: 'scope', line: li + 1, name, msg: `{${name}} 不能用在這裡，只能用在「${VAR_SCOPE_LABEL[other]}」` }); continue; }
        const sug = varSuggest(name, defs.filter(okHere));
        out.errors.push({ type: 'unknown', line: li + 1, name, suggest: sug, msg: `第 ${li + 1} 行的 {${name}} 不是可用的變數${sug ? `，你是不是要用 {${sug}}？` : ''}` });
      }
    }
    if (open >= 0) out.errors.push({ type: 'brace', line: li + 1, name: line.slice(open), msg: `第 ${li + 1} 行的「${line.slice(open, open + 12)}」少了右括號 }` });
  });
  return out;
}
/* 最接近的變數名稱（共同字數最多，且至少一半相同） */
function varSuggest(name, defs) {
  let best = '', score = 0;
  defs.forEach(d => [d.k].concat(d.alias || []).forEach(n => {
    let c = 0; for (const ch of new Set(name)) if (n.indexOf(ch) >= 0) c++;
    const sc = c / Math.max(n.length, name.length);
    if (sc > score) { score = sc; best = d.k; }
  }));
  return score >= 0.5 ? best : '';
}
/* 深層檢查：字串、陣列、物件裡所有字串 */
function varCheckDeep(v, scope, tplKey) {
  const out = { errors: [], infos: [] };
  const walk = x => { if (typeof x === 'string') { const r = varCheck(x, scope, tplKey); out.errors.push(...r.errors); out.infos.push(...r.infos); } else if (Array.isArray(x)) x.forEach(walk); else if (x && typeof x === 'object') Object.keys(x).forEach(k => walk(x[k])); };
  walk(v); return out;
}
const TPL_NAME = { EV_PAID: '報名成立・付款完成', EV_ATM: '報名成立・ATM 待付款', EV_WAITLIST: '加入候補', EV_OFFER: '候補遞補', EV_REMIND_ONLINE: '行前提醒・線上', EV_REMIND_ONSITE: '行前提醒・現場', EV_DAY: '課程當日提醒', EV_CHANGED: '場次異動／取消', BOOKING_CREATED: '預約成立', DEPOSIT_CONFIRMED: '訂金確認', BALANCE_CONFIRMED: '尾款確認', PRE_REMINDER: '服務前提醒', DAY_REMINDER: '服務當日提醒', COMPANION_START: '陪伴期開始', COMPANION_END: '陪伴期結束', RESCHEDULED: '改期確認', NO_SHOW: '未出席通知' };

/* Template rendering — §6.2 */
function renderTemplate(tpl, b, ctx) {
  ctx = ctx || {};
  const site = ctx.siteUrl || '';
  const vars = {
    '姓名': b.name || '', '方案': b.planName || '', '日期': b.date ? U.dateLabel(b.date, true) : '',
    '時間': b.startTime ? `${b.startTime} – ${b.endTime || ''}` : '', 'Zoom連結': b.zoomLink || '（尚未提供）', '預約編號': b.bookingId || '',
    '主題': b.topic || '', '期待改變': b.expectChange || '',
    '未出席次數': String(ctx.noShowCount != null ? ctx.noShowCount : ''), '本筆尾款': U.money(b.balance), '本筆訂金': U.money(b.deposit),
    '尾款期限': b.balanceDueDate ? U.dot(b.balanceDueDate) : '', '我的預約': (site || '') + '#/my/' + (b.bookingId || ''),
    '付款項目': payItemOf(b), '本筆金額': U.money(b.deposit)
  };
  vars['尾款'] = vars['本筆尾款']; vars['訂金'] = vars['本筆訂金']; vars['金額'] = vars['本筆金額'];   /* 舊名稱仍可代入 */
  if (ctx.vars) Object.assign(vars, ctx.vars);   /* 課程通知：報名資料的變數 */
  const full = isFullPay(b);
  const r = str => fullPayText(String(str || ''), full).replace(/\{([^}]+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
  const buttons = [];
  [['btn1Label', 'btn1Url'], ['btn2Label', 'btn2Url']].forEach(([l, u]) => { if (tpl[l] && tpl[u] && !(full && /尾款/.test(tpl[l]))) buttons.push({ label: r(tpl[l]), url: r(tpl[u]) }); });
  return { title: r(tpl.title || tpl.name), body: r(tpl.body), buttons, format: tpl.format };
}
/* full-pay wording for templates (also keeps admin-edited / older templates correct):
   lines that mention 尾款 are dropped, 訂金確認 → 付款確認, any remaining 訂金 → 費用. Ported to Code.gs fullPayText_. */
function fullPayText(str, full) {
  if (!full) return str;
  /* {變數} 內的文字不改（例如 {本筆訂金} 不會被改成 {本筆費用}） */
  return str.split('\n').filter(line => line.indexOf('尾款') < 0).join('\n').replace(/\{[^{}\n]*\}|訂金確認|訂金/g, m => m[0] === '{' ? m : m === '訂金確認' ? '付款確認' : '費用');
}

/* ===================== API client, session, tracking, UI helpers ===================== */
const CFG = window.MIA_CONFIG || {};
const IS_DEMO = !!(CFG.FORCE_DEMO || !CFG.GAS_URL);
const MOCK = IS_DEMO ? new MockBackend() : null;

/* Front and admin keep separate sessions, so Mia can test the booking site and manage the back office in the same browser. */
const Session = {
  KEY: 'mia.session', _mem: {},
  area(a) { return a || (location.hash.indexOf('#/admin') === 0 ? 'admin' : 'front'); },
  key(a) { return this.area(a) === 'admin' ? 'mia.session.admin' : 'mia.session'; },
  get(a) { const k = this.key(a); let s = null; try { s = JSON.parse(U.ls.get(k) || 'null'); } catch (e) { } s = s || this._mem[k] || null; if (s && s.expiresAt && s.expiresAt < U.iso()) { this.clear(a); return null; } return s; },
  set(s, a) { const k = this.key(a); this._mem[k] = s; U.ls.set(k, JSON.stringify(s)); },
  clear(a) { const k = this.key(a); U.ls.del(k); delete this._mem[k]; },
  token(a) { const s = this.get(a); return s ? s.token : ''; },
  user(a) { const s = this.get(a); return s ? s.user : null; },
  setUser(u, a) { const s = this.get(a); if (s) { s.user = u; this.set(s, a); } }
};

const api = {
  async call(action, data) {
    const token = Session.token();
    try {
      if (IS_DEMO) return await MOCK.call(action, data, token);
      const res = await fetch(CFG.GAS_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action, token, data: data || {} }) });
      const j = await res.json();
      if (!j.ok) throw new ApiError(j.error && j.error.code || 'INTERNAL', j.error && j.error.message);
      return j.data;
    } catch (e) {
      if (!(e instanceof ApiError)) e = new ApiError('INTERNAL', '無法連線到預約系統，請稍後再試');
      if (['AUTH_EXPIRED', 'AUTH_INVALID'].includes(e.code)) { Session.clear(); }
      throw e;
    }
  }
};

/* front tracking */
const Tracker = {
  q: [], sid: null,
  sessionId() { if (!this.sid) { this.sid = U.ss.get('mia.sid') || ('S-' + U.rid(8)); U.ss.set('mia.sid', this.sid); } return this.sid; },
  push(event, extra) {
    if (CFG.TRACKING === false) return;
    const ev = Object.assign({ event, step: EVENT_STEP[event], ts: U.iso() }, extra || {}); const src = typeof SRC !== 'undefined' && SRC.cur(); if (src) ev.meta = Object.assign({}, ev.meta || {}, { src });
    this.q.push(ev);
    clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 1500);
  },
  flush(beacon) {
    if (!this.q.length) return; const events = this.q.splice(0, 20);
    const body = { action: 'track', token: Session.token('front'), data: { sessionId: this.sessionId(), events } };
    if (IS_DEMO) { MOCK.call('track', body.data, body.token).catch(() => { }); return; }
    try { if (beacon && navigator.sendBeacon) { navigator.sendBeacon(CFG.GAS_URL, new Blob([JSON.stringify(body)], { type: 'text/plain' })); return; } } catch (e) { }
    fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify(body), keepalive: true }).catch(() => { });
  }
};
window.addEventListener('pagehide', () => { if (location.hash.indexOf('#/admin') !== 0 && App.step) Tracker.push('LEAVE', { step: App.step }); Tracker.flush(true); });

function modal(opts) {
  return new Promise(resolve => {
    const sc = document.createElement('div'); sc.className = 'scrim' + (opts.sheet ? ' sheet' : '') + (opts.cls ? ' ' + opts.cls : '');
    sc.innerHTML = `<div class="modal${opts.wide ? ' wide' : ''}${opts.sheet ? ' sheet' : ''}" role="dialog" aria-modal="true"><div class="mh"><h3>${U.esc(opts.title || '')}</h3><button class="x" data-x aria-label="關閉">${ic('x')}</button></div><div class="mb">${opts.html || ''}</div>${opts.cancel === false && !opts.ok ? '' : `<div class="mf">${opts.cancel === false ? '' : `<button class="btn ghost sm b sec" data-x>${U.esc(opts.cancel || '返回')}</button>`}${opts.ok ? `<button class="btn sm ${opts.danger ? 'danger' : 'pri'} b ${opts.danger ? 'danger' : 'pri'}" data-ok>${U.esc(opts.ok)}</button>` : ''}</div>`}</div>`;

/* pager (SPEC_v2 §2.2): returns HTML for .pager and binds via delegation. state = {page, pageSize, sizes?:number[]|false (default [20,50,100])}; onPage(page, pageSize). */
const Pagers = { n: 0, fns: {} };
function pager(state, total, onPage) {
  const id = 'pg' + (++Pagers.n); Pagers.fns[id] = onPage;
  const ps = Math.max(1, +state.pageSize || 50), pages = Math.max(1, Math.ceil((+total || 0) / ps)), page = Math.max(1, Math.min(pages, +state.page || 1));
  const a = total ? (page - 1) * ps + 1 : 0, z = Math.min(total, page * ps);
  const nums = []; const add = n => nums.push(n);
  if (pages <= 7) { for (let i = 1; i <= pages; i++) add(i); }
  else { add(1); if (page > 4) add('…'); for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) add(i); if (page < pages - 3) add('…'); add(pages); if (page <= 4 && nums.indexOf(2) < 0) nums.splice(1, 0, 2); }
  const sizes = state.sizes === false ? null : (state.sizes || [20, 50, 100]);
  const sizeSel = sizes ? `<select class="ps" data-pg-size aria-label="每頁筆數">${(sizes.indexOf(ps) < 0 ? sizes.concat(ps).sort((x, y) => x - y) : sizes).map(n => `<option value="${n}"${n === ps ? ' selected' : ''}>每頁 ${n}</option>`).join('')}</select>` : '';
  return `<nav class="pager" data-pager="${id}" data-page="${page}" data-ps="${ps}" aria-label="分頁"><span class="rng">第 ${a.toLocaleString('en-US')}–${z.toLocaleString('en-US')} 筆／共 ${(+total || 0).toLocaleString('en-US')} 筆</span>${sizeSel}`
    + `<button type="button" class="pg" data-pg="${page - 1}"${page <= 1 ? ' disabled' : ''} aria-label="上一頁">${ic('left')}</button>`
    + nums.map(n => n === '…' ? '<span class="pg gap">…</span>' : `<button type="button" class="pg${n === page ? ' on' : ''}" data-pg="${n}"${n === page ? ' aria-current="page"' : ''}>${n}</button>`).join('')
    + `<button type="button" class="pg" data-pg="${page + 1}"${page >= pages ? ' disabled' : ''} aria-label="下一頁">${ic('right')}</button></nav>`;
}

  const nav = b.closest('[data-pager]'); if (!nav) return;   // a .pager not built by pager() handles its own clicks

const LineAuth = {
  redirectUri() { return CFG.SITE_URL || (location.origin + location.pathname); },
  start(area, returnHash) {
    const state = U.rid(12), nonce = U.rid(12);
    U.ss.set('mia.oauth', JSON.stringify({ state, nonce, returnHash: returnHash || '#/', area }));
    const p = new URLSearchParams({ response_type: 'code', client_id: CFG.LINE_LOGIN_CHANNEL_ID, redirect_uri: this.redirectUri(), state, scope: 'openid profile', nonce });
    if (area !== 'admin') p.set('bot_prompt', 'aggressive');
    location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + p.toString();
  },
  async handleReturn() {
    const qs = new URLSearchParams(location.search);
    if (!qs.get('code') && !qs.get('error')) return false;
    let st = {}; try { st = JSON.parse(U.ss.get('mia.oauth') || '{}'); } catch (e) { }
    U.ss.del('mia.oauth');
    const clean = () => { const h = st.returnHash || '#/'; try { history.replaceState(null, '', this.redirectUri() + h); } catch (e) { history.replaceState(null, '', location.pathname + h); } };
    if (qs.get('error') || qs.get('state') !== st.state) { clean(); toast('LINE 登入未完成，請再試一次', 'err'); return true; }
    try {
      const r = await api.call('authLineExchange', { code: qs.get('code'), redirectUri: this.redirectUri(), nonce: st.nonce, area: st.area || 'front', sessionId: Tracker.sessionId() });
      Session.set({ token: r.token, user: r.user, expiresAt: r.expiresAt }, st.area === 'admin' ? 'admin' : 'front');
      if (st.area !== 'admin') Tracker.push('LOGIN');
    } catch (e) { errToast(e); }
    clean(); return true;
  }
};

const BP_Q = { m: '(max-width: 760px)', d: '(min-width: 1101px)' };
const App = {
  cfg: null, site: null, step: 0, mode: 'web', _bpSubs: [], _bp: null,
  draft: (() => { try { return JSON.parse(U.ss.get('mia.draft') || '{}'); } catch (e) { return {}; } })(),
  saveDraft() { U.ss.set('mia.draft', JSON.stringify(this.draft)); },
  clearDraft() { this.draft = {}; U.ss.del('mia.draft'); },
  go(h) { if (location.hash === h) this.route(); else location.hash = h; },
  /* entry mode §1.1 */
  resolveMode() {
    let from = null;
    try { from = new URLSearchParams(location.search).get('from'); } catch (e) { }
    if (from === 'web') { U.ss.del('mia.mode'); this.mode = 'web'; }
    else if (from === 'line' || /\bLine\//i.test(navigator.userAgent || '') || U.ss.get('mia.mode') === 'line') { this.mode = 'line'; U.ss.set('mia.mode', 'line'); }
    else this.mode = 'web';
    if (from != null) {
      try { const qs = new URLSearchParams(location.search); qs.delete('from'); const q = qs.toString(); history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) { }
    }
    return this.mode;
  },
  isLine() { return this.mode === 'line'; },
  bp() {
    try { if (window.matchMedia(BP_Q.m).matches) return 'm'; if (window.matchMedia(BP_Q.d).matches) return 'd'; return 't'; }
    catch (e) { const w = window.innerWidth || 1366; return w <= 760 ? 'm' : w > 1100 ? 'd' : 't'; }
  },
  onBp(fn) { this._bpSubs.push(fn); return () => { this._bpSubs = this._bpSubs.filter(f => f !== fn); }; },
  _bpChanged() {
    const b = this.bp(); if (b === this._bp) return; this._bp = b;
    document.body.classList.remove('bp-m', 'bp-t', 'bp-d'); document.body.classList.add('bp-' + b);
    this._bpSubs.slice().forEach(f => { try { f(b); } catch (e) { console.error(e); } });
  },
  bodyClass(area) { return area + (this.isLine() ? ' line' : '') + ' bp-' + this.bp(); },
  async loadCfg(force) { if (!this.cfg || force) this.cfg = await api.call('getConfig'); return this.cfg; },
  async loadSite(force) { if (!this.site || force) this.site = await api.call('getSiteContent'); return this.site; },
  loadAll(force) { return Promise.all([this.loadCfg(force), this.loadSite(force)]); },
  reload() { this.cfg = null; this.site = null; return this.route(); },
  async route() {
    const h = location.hash || '#/';
    const root = $('#app');
    try {
      const area = h.indexOf('#/admin') === 0 ? 'admin' : 'front';
      document.body.className = this.bodyClass(area); this._bp = this.bp();
      if (area === 'admin') await Admin.route(h, root); else await Front.route(h, root);
      paintPlanets(root);
    } catch (e) {
      if (e && (e.code === 'AUTH_REQUIRED' || e.code === 'AUTH_EXPIRED' || e.code === 'AUTH_INVALID')) { this.go(h.indexOf('#/admin') === 0 ? '#/admin/login' : '#/login?r=' + encodeURIComponent(h)); return; }
      console.error(e); errToast(e);
    }
  },
  refreshSoft() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; if ($('.scrim')) return; this.route(); }
};
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); App.route(); });
window.addEventListener('storage', e => { if (e.key === 'mia.care.demo.db' || String(e.key).indexOf('mia.session') === 0) { if (MOCK) MOCK.load(); App.cfg = null; App.site = null; App.refreshSoft(); } });
try { Object.values(BP_Q).forEach(q => { const mq = window.matchMedia(q); const f = () => App._bpChanged(); mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f); }); } catch (e) { window.addEventListener('resize', () => App._bpChanged()); }

/* demo badge */
function mountDemoBadge() {
  if (!IS_DEMO) return;
  const b = document.createElement('button'); b.id = 'demo-badge'; b.innerHTML = ic('sparkle') + '展示模式'; document.body.appendChild(b);
  b.addEventListener('click', () => {
    let m = $('#demo-menu'); if (m) { m.remove(); return; }
    m = document.createElement('div'); m.id = 'demo-menu';
    m.innerHTML = `<a href="展示_陪伴網站.html" target="_blank" rel="noopener">${ic('home')}客人頁（展示）</a><a href="#/admin">${ic('gear')}陪伴後台</a><div class="sep"></div><button data-act="sched">${ic('clock')}執行排程一次</button><button data-act="archive">${ic('archive')}執行封存一次</button><button data-act="large">${ic('db')}展示資料・大量${MOCK.isLarge() ? '（使用中）' : ''}</button><button data-act="reset">${ic('refund')}重設展示資料</button><button data-act="out">${ic('x')}登出</button>`;
    document.body.appendChild(m);
    m.addEventListener('click', async e => {
      const a = e.target.closest('[data-act]'); m.remove(); if (!a) return;
      if (a.dataset.act === 'reset') { if (await confirmBox('重設展示資料', '<p>清除展示模式中所有預約與設定，回到初始範例資料。</p>', '重設')) { MOCK.reset(); Session.clear('front'); Session.clear('admin'); App.clearDraft(); App.cfg = null; App.site = null; toast('已重設展示資料', 'ok'); App.go('#/'); } }
      if (a.dataset.act === 'large') { if (await confirmBox('展示資料・大量', '<p>重新產生 80 筆預約、40 位客戶、24 題常見問題與 12 個方案，用於檢查大量資料的版面。「重設展示資料」可回到少量資料。</p>', '產生')) { MOCK.seedLarge(); Session.clear('front'); App.clearDraft(); App.cfg = null; App.site = null; toast('已產生大量展示資料', 'ok'); App.route(); } }
      if (a.dataset.act === 'archive') { const r = MOCK.archiveLogs(); const n = Object.values(r.archived).reduce((x, y) => x + y, 0); toast(`封存完成・移動 ${n} 筆（${U.dot(r.cutoff)} 以前）`, 'ok'); App.route(); }
      if (a.dataset.act === 'sched') { const n = MOCK.runScheduler(); toast(`排程完成・處理 ${n} 項`, 'ok'); App.route(); }
      if (a.dataset.act === 'out') { Session.clear(); toast('已登出'); App.route(); }
    });
  });
  document.addEventListener('click', e => { const m = $('#demo-menu'); if (m && !e.target.closest('#demo-menu') && !e.target.closest('#demo-badge')) m.remove(); });
}

async function boot() {
  App.resolveMode();
  document.body.className = App.bodyClass(location.hash.indexOf('#/admin') === 0 ? 'admin' : 'front');
  mountDemoBadge();
  if (!IS_DEMO) await LineAuth.handleReturn();
  if (Session.token()) { try { const r = await api.call('authMe'); Session.setUser(r.user); } catch (e) { } }
  if (IS_DEMO) { try { MOCK.runScheduler(); } catch (e) { } setInterval(() => { try { MOCK.runScheduler(); } catch (e) { } }, 60000); }
  if (App.isLine() && !U.ss.get('mia.lineEntered')) { U.ss.set('mia.lineEntered', '1'); Tracker.push('LINE_ENTER'); }
  App.route();
}

/* ===================== Planets (F) — SPEC_v2 §2.3 =====================
   Port of mockups3/shared/sky.js planetSVG. Palette per style from tokens.css --pl-{style}-hi/mid/lo.
   window.Planets.svg(style, opts) → SVG string ; window.Planets.paint(root) fills every [data-planet]. */
(function () {
  let uid = 0, pal = null;
  const ATM = { money: '#FFD9C4', talent: '#DCCBFF', rel: '#BFE3FF', love: '#FFD3E6', check: '#BDF0EA', custom1: '#C9D4FF', custom2: '#FFE6BF', custom3: '#CBF5DF', custom4: '#B5E2FF', custom5: '#FFD5CC', custom6: '#E8DCFF', custom7: '#E0ECF8', pearl: '#EAF3FF', hero: '#CDE8FF' };
  const SHAPE = {
    money: { ring: { tilt: -14, c: '#FFE8D6', n: 3 }, bands: 1 },
    talent: { moon: '#EDE6FF' },
    rel: { moon: '#E7F5FF', bands: 1 },
    love: {},
    check: { ring: { tilt: 18, c: '#D9FFF8', n: 2 }, bands: 1 },
    custom1: { ring: { tilt: 22, c: '#EEF2FF', n: 2 } },
    custom2: { moon: '#FFF1DA' },
    custom3: { bands: 1 },
    custom4: { ring: { tilt: -24, c: '#E3F5FF', n: 2 } },
    custom5: { bands: 1 },
    custom6: { moon: '#F4EEFF' },
    custom7: { bands: 1 },
    pearl: { bands: 1, tex: 0.45, ring: { tilt: -19, c: '#FFFFFF', n: 7 } },
    hero: { ring: { tilt: -16, c: '#FFFFFF', n: 5 }, bands: 1 }
  };
  const FALLBACK = {
    money: ['#FFF6EC', '#F7CDB2', '#B9849A'], talent: ['#F8F2FF', '#C9B8F2', '#6E63AE'], rel: ['#F3FBFF', '#A9D6FA', '#4A78B4'], love: ['#FFF3F8', '#F2BCD6', '#8E6AA6'], check: ['#F0FFFC', '#A6E3DE', '#3F8A9E'],
    custom1: ['#F4F7FF', '#AFC0F2', '#4B5BA6'], custom2: ['#FFF8F0', '#F5D9A8', '#A07A62'], custom3: ['#F2FFF8', '#B4E6CC', '#4A8A86'], custom4: ['#EFF9FF', '#8FCBEF', '#2F6A9E'], custom5: ['#FFF4F2', '#F4BFB4', '#9A6077'],
    custom6: ['#FBF7FF', '#D9C9F5', '#6C5C9E'], custom7: ['#FFFFFF', '#C8D8EA', '#53698E'], pearl: ['#FFFFFF', '#C4DAF3', '#56709F'], hero: ['#FFFFFF', '#BFE0FF', '#4F7DBF']
  };
  function palette() {
    if (pal) return pal;
    pal = {};
    let cs = null; try { cs = getComputedStyle(document.documentElement); } catch (e) { }
    Object.keys(FALLBACK).forEach(k => {
      const g = n => { const v = cs && cs.getPropertyValue(`--pl-${k}-${n}`).trim(); return v || null; };
      const f = FALLBACK[k];
      pal[k] = { hi: g('hi') || f[0], mid: g('mid') || f[1], lo: g('lo') || f[2] };
    });
    return pal;
  }
  function spec(style, opts) {
    opts = opts || {};
    const st = FALLBACK[style] ? style : 'rel';
    const o = Object.assign({ atm: ATM[st], iri: 1 }, palette()[st], SHAPE[st]);
    if (opts.ring === false) o.ring = null;
    else if (opts.ring === true && !o.ring) o.ring = { tilt: -16, c: '#FFFFFF', n: 3 };
    if (opts.ringN && o.ring) o.ring = Object.assign({}, o.ring, { n: +opts.ringN });
    if (opts.glow != null) o.glow = +opts.glow;
    if (opts.shade) o.shade = opts.shade;
    if (opts.moon === false) o.moon = null;
    return o;
  }
  function planetSVG(o, lite) {
    const id = 'pl' + (++uid), r = 100;
    const ring = o.ring, pad = ring ? 2.0 : 1.42;
    const W = r * 2 * pad, H = ring ? r * 2 * 1.3 : W, cx = W / 2, cy = H / 2;
    const shade = o.shade || '#13224A';
    const glow = o.glow == null ? 1 : o.glow;
    let ringBack = '', ringFront = '';
    if (ring) {
      const rx = r * 1.85, ry = r * 0.42; let lines = ''; const n = ring.n || 3;
      for (let i = 0; i < n; i++) {
        const k = 1 - i * (0.42 / n), sw = i === 0 ? 7 : (i % 2 ? 2.2 : 4.5), op = i === 0 ? 0.7 : (0.42 + 0.3 * ((i + 1) % 2));
        lines += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * k}" ry="${ry * k}" fill="none" stroke="url(#${id}rg)" stroke-width="${sw}" opacity="${op}"/>`;
      }
      lines += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * 1.06}" ry="${ry * 1.06}" fill="none" stroke="url(#${id}rg)" stroke-width="0.8" opacity="0.6"/>`;
      const g = `<g transform="rotate(${ring.tilt} ${cx} ${cy})">`;
      ringBack = `${g}<g clip-path="url(#${id}cb)">${lines}</g></g>`;
      ringFront = `${g}<g clip-path="url(#${id}cf)">${lines}</g></g>`;
    }
    const moon = o.moon ? `<circle cx="${cx + r * 1.05}" cy="${cy - r * 0.9}" r="${r * 0.16}" fill="url(#${id}mn)"/>` : '';
    /* lite = no turbulence filter (cheap for lists of many small planets) */
    const tex = lite ? '' : `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" filter="url(#${id}nz)" opacity="${o.tex || 0.4}" style="mix-blend-mode:soft-light"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="pl-svg" aria-hidden="true" focusable="false" style="overflow:visible"><defs>
<radialGradient id="${id}b" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="${o.hi}"/><stop offset=".42" stop-color="${o.mid}"/><stop offset="1" stop-color="${o.lo}"/></radialGradient>
<linearGradient id="${id}ir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3F1" stop-opacity=".1"/><stop offset=".28" stop-color="#FFCFE6" stop-opacity=".6"/><stop offset=".46" stop-color="#CFE3FF" stop-opacity=".2"/><stop offset=".62" stop-color="#BDFFF0" stop-opacity=".55"/><stop offset=".82" stop-color="#E2CCFF" stop-opacity=".45"/><stop offset="1" stop-color="#E7D5FF" stop-opacity="0"/></linearGradient>
<radialGradient id="${id}t" cx="28%" cy="24%" r="100%"><stop offset=".42" stop-color="${shade}" stop-opacity="0"/><stop offset=".7" stop-color="${shade}" stop-opacity=".42"/><stop offset=".9" stop-color="${shade}" stop-opacity=".78"/><stop offset="1" stop-color="${shade}" stop-opacity=".9"/></radialGradient>
<radialGradient id="${id}rim" cx="50%" cy="50%" r="50%"><stop offset=".8" stop-color="${o.atm}" stop-opacity="0"/><stop offset=".95" stop-color="${o.atm}" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></radialGradient>
<linearGradient id="${id}rl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="${id}rg" x1="0" x2="1"><stop offset="0" stop-color="${ring ? ring.c : '#fff'}" stop-opacity=".1"/><stop offset=".25" stop-color="${ring ? ring.c : '#fff'}" stop-opacity="1"/><stop offset=".42" stop-color="#FFD3EA" stop-opacity=".95"/><stop offset=".6" stop-color="#E2DAFF" stop-opacity=".9"/><stop offset=".8" stop-color="#D7FFF7" stop-opacity=".95"/><stop offset="1" stop-color="${ring ? ring.c : '#fff'}" stop-opacity=".15"/></linearGradient>
<radialGradient id="${id}mn" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="${o.moon || '#fff'}"/><stop offset="1" stop-color="${o.lo}"/></radialGradient>
<radialGradient id="${id}ag" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="${o.atm}" stop-opacity="${0.55 * glow}"/><stop offset=".75" stop-color="${o.atm}" stop-opacity="${0.18 * glow}"/><stop offset="1" stop-color="${o.atm}" stop-opacity="0"/></radialGradient>
${lite ? '' : `<filter id="${id}nz" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${o.bands ? '0.004 0.05' : '0.022'}" numOctaves="4" seed="${uid * 7}"/><feColorMatrix values="1.6 0 0 0 -0.3  1.6 0 0 0 -0.3  1.6 0 0 0 -0.3  0 0 0 0 1"/></filter>`}
<filter id="${id}sp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r * 0.09}"/></filter>
<clipPath id="${id}c"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
<clipPath id="${id}cb" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="${W}" height="${cy}"/></clipPath>
<clipPath id="${id}cf" clipPathUnits="userSpaceOnUse"><rect x="0" y="${cy}" width="${W}" height="${H}"/></clipPath>
</defs>
<circle cx="${cx}" cy="${cy}" r="${r * 1.38}" fill="url(#${id}ag)"/>${ringBack}
<g clip-path="url(#${id}c)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}b)"/>${tex}${o.iri ? `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" fill="url(#${id}ir)" style="mix-blend-mode:screen"/>` : ''}<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}t)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}rim)"/><ellipse cx="${cx - r * 0.36}" cy="${cy - r * 0.42}" rx="${r * 0.3}" ry="${r * 0.2}" fill="#fff" opacity=".55" filter="url(#${id}sp)"/></g>
<circle cx="${cx}" cy="${cy}" r="${r - 0.8}" fill="none" stroke="url(#${id}rl)" stroke-width="1.6" opacity=".9"/>${ringFront}${moon}</svg>`;
  }
  const Planets = {
    svg(style, opts) { return planetSVG(spec(style, opts), opts && opts.lite); },
    /* k = svg width / host width so the planet body fills the host even when ringed */
    k(style, opts) { return spec(style, opts).ring ? (2.0 / 1.42).toFixed(3) : 1; },
    paint(root) {
      (root || document).querySelectorAll('[data-planet]').forEach(el => {
        const ds = el.dataset;
        const sig = [ds.planet, ds.noring, ds.ring, ds.glow, ds.shade, ds.ringn, ds.lite].join('|');
        if (el._plSig === sig && el.firstElementChild) return;
        const opts = { glow: ds.glow != null ? +ds.glow : undefined, shade: ds.shade, ringN: ds.ringn, lite: ds.lite === '1' };
        if (ds.noring) opts.ring = false; else if (ds.ring === '1') opts.ring = true;
        el.innerHTML = Planets.svg(ds.planet, opts);
        el.style.setProperty('--k', Planets.k(ds.planet, opts));
        el._plSig = sig;
      });
    },
    reset() { pal = null; }
  };
  window.Planets = Planets;
})();

/* v4 功能開關（後台開放後才在前台出現；未開放時顯示「即將開放」） */
const FEAT = k => { const c = (typeof Front !== 'undefined' && Front.cfg) || App.cfg || {}; return !!((c.settings || {})['feature.' + k]); };
/* ===================== FRONT v4：總結報告（設計稿 R2）・需本人 LINE 登入 ===================== */
/* 檔案：由後端取回後在瀏覽器裡開啟（Google 雲端的檔案不公開） */
const FileView = {
  cache: {},
  async blob(fileId) {
    if (this.cache[fileId]) return this.cache[fileId];
    const x = await api.call('getFile', { fileId });
    if (!x.data) throw new ApiError('NOT_FOUND', IS_DEMO ? '展示模式只保存 1.5 MB 以下的檔案內容，這個檔案無法預覽' : '無法開啟檔案');
    const bin = atob(x.data.replace(/^data:[^,]*,/, '')), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: x.file.type }));
    return (this.cache[fileId] = { url, file: x.file });
  },
  async open(fileId) { try { const b = await this.blob(fileId); window.open(b.url, '_blank', 'noopener'); } catch (e) { errToast(e); } },
  async download(fileId) { try { const b = await this.blob(fileId); const a = document.createElement('a'); a.href = b.url; a.download = b.file.name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { errToast(e); } },
  size(n) { n = +n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; },
  kind(t) { return t === 'application/pdf' ? 'PDF' : t === 'image/png' ? 'PNG' : 'JPG'; }
};
/* 文字報告：支援 # 標題、- 清單、空行分段 */
function reportTextHTML(t) {
  const out = []; let list = null;
  String(t || '').split('\n').forEach(line => {
    const l = line.trim();
    if (/^[-・•]\s*/.test(l) && l.length > 1) { if (!list) { list = []; } list.push(`<li>${esc(l.replace(/^[-・•]\s*/, ''))}</li>`); return; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    if (!l) return;
    if (/^#{1,3}\s/.test(l)) out.push(`<h3>${esc(l.replace(/^#+\s*/, ''))}</h3>`); else out.push(`<p>${esc(l)}</p>`);
  });
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}

      <section class="card blk rp-ack">${r.ackAt ? `<h2>謝謝你，Mia 已收到你的確認</h2><p class="muted num">${U.tsLabel(r.ackAt)} 確認收到${b.companionEndDate ? `・陪伴期到 ${U.dot(b.companionEndDate)}` : ''}</p>${r.feedback ? `<p class="rp-fb">「${esc(r.feedback)}」</p>` : ''}`
        : `<h2>確認收到</h2><label class="fld"><span class="lbl"><span>想對 Mia 說的話</span><small>選填</small></span><textarea class="inp" rows="3" maxlength="500" data-fb placeholder="看完報告的感受，或想再聊聊的地方"></textarea></label><button class="btn pri full" data-ack>${ic('check')}我已收到報告</button>`}</section>

      rt.querySelectorAll('[data-fdl]').forEach(x => x.addEventListener('click', () => FileView.download(x.dataset.fdl)));
      rt.querySelectorAll('[data-fimg]').forEach(async el => { try { const bl = await FileView.blob(el.dataset.fimg); el.innerHTML = `<img src="${bl.url}" alt="${esc(bl.file.name)}">`; } catch (e) { el.remove(); } });
      const ak = rt.querySelector('[data-ack]'); if (ak) ak.addEventListener('click', async () => { ak.disabled = true; try { await api.call('ackReport', { bookingId: id, feedback: rt.querySelector('[data-fb]').value.trim() }); toast('謝謝你，Mia 收到了', 'ok'); this.reportPage(root, id, true); } catch (e) { errToast(e); ak.disabled = false; } });

  /* 我的預約：已完成的預約顯示報告狀態 */
  soonPage(root, name) {

  reportRow(b) {
    if (!FEAT('report')) return '';

  }

/* ---- admin-ui.js ---- */
/* ===================== ADMIN UI helpers (Builder K) =====================
   Shared by admin.js / admin-content.js / admin-quiz.js / admin-faq.js.
   Only relies on SPEC_v2 §2 interfaces; every v2 interface has a local fallback so the
   admin keeps working while S's core/app land. */
const AUI = {
  /* ---------- environment ---------- */
  bp() { if (typeof App !== 'undefined' && App.bp) { try { return App.bp(); } catch (e) { } } const w = window.innerWidth; return w <= 760 ? 'm' : w <= 1100 ? 't' : 'd'; },
  esc(s) { return U.esc(s); },
  n(v) { return Number(v || 0).toLocaleString('en-US'); },
  ic(n, c) { return ic(n, c); },
  /* planet: v2 planet(style, cls, opts) → span[data-planet]; v1 → svg sprite. Callers run AUI.paint(root) after mount. */
  pl(style, cls, opts) { try { return planet(style || 'rel', cls || '', opts || {}); } catch (e) { return `<span class="${cls || ''}"></span>`; } },
  paint(root) { try { if (window.Planets && Planets.paint) Planets.paint(root || document); } catch (e) { } },
  mirror(txt) { return txt ? `<span class="mirror" title="前台對應">${ic('phone')}<span>前台對應</span><b>${txt}</b></span>` : ''; },
  tagPlan(style, name) { return `<span class="ptag p-${U.esc(style || 'rel')}"><i></i>${U.esc(name || '')}</span>`; },
  avatar(name, cls) { return `<span class="av ${cls || ''}">${U.esc(String(name || '?').slice(0, 1))}</span>`; },

  /* ---------- hash query ---------- */
  path() { return (location.hash || '#/').slice(1).split('?')[0].split('/').filter(Boolean); },
  q() { const s = (location.hash.split('?')[1] || ''); const o = {}; new URLSearchParams(s).forEach((v, k) => { o[k] = v; }); return o; },
  /** build '#/admin/x?…' dropping empty values and values equal to defaults */
  hash(base, obj, defs) {
    const p = new URLSearchParams(); defs = defs || {};
    Object.keys(obj || {}).forEach(k => { const v = obj[k]; if (v === '' || v == null || String(v) === String(defs[k] == null ? '' : defs[k])) return; p.set(k, v); });
    const s = p.toString(); return base + (s ? '?' + s : '');
  },
  replace(h) { try { history.replaceState(null, '', h); } catch (e) { location.hash = h; } },
  debounce(fn, ms) { let t; return function () { const a = arguments, me = this; clearTimeout(t); t = setTimeout(() => fn.apply(me, a), ms); }; },

  /* ---------- form atoms ---------- */
  sw(on, attrs, label) { return `<button type="button" class="switch" role="switch" aria-checked="${!!on}" ${attrs || ''} ${label ? `aria-label="${U.esc(label)}"` : ''}></button>`; },
  cbx(on, attrs, label, mixed) { return `<button type="button" class="cbx ${on ? 'on' : ''} ${mixed ? 'mid' : ''}" role="checkbox" aria-checked="${mixed ? 'mixed' : !!on}" ${attrs || ''} aria-label="${U.esc(label || '選取')}"></button>`; },
  /** text input with live counter. opt {key, label, max, value, ph, type:'text'|'textarea', req, help, ro} */
  field(o) {
    const v = o.value == null ? '' : String(o.value);
    const cnt = o.max ? `<small class="num" data-cnt>${v.length} / ${o.max}</small>` : (o.hint ? `<small>${o.hint}</small>` : '');
    const attrs = `class="inp" ${o.attr || ''} ${o.key ? `data-k="${U.esc(o.key)}"` : ''} ${o.max ? `maxlength="${o.max}"` : ''} ${o.ph ? `placeholder="${U.esc(o.ph)}"` : ''} ${o.ro ? 'readonly' : ''} ${o.id ? `id="${o.id}"` : ''}`;
    const ctl = o.type === 'textarea' ? `<textarea ${attrs} rows="${o.rows || 3}">${U.esc(v)}</textarea>` : `<input ${attrs} type="${o.inputType || 'text'}" value="${U.esc(v)}">`;
    return `<label class="fld ${o.cls || ''}"><span class="lbl"><span>${U.esc(o.label)}${o.req ? '<span class="req">*</span>' : ''}</span>${cnt}</span>${ctl}${o.help ? `<span class="help">${o.help}</span>` : ''}</label>`;
  },
  bindCounters(root) {
    root.querySelectorAll('.fld').forEach(f => { const c = f.querySelector('[data-cnt]'), i = f.querySelector('.inp'); if (!c || !i) return; const mx = i.getAttribute('maxlength'); i.addEventListener('input', () => { c.textContent = i.value.length + ' / ' + mx; }); });
  },
  bindSwitches(root, fn) {
    root.querySelectorAll('.switch').forEach(s => s.addEventListener('click', e => { e.stopPropagation(); if (s.disabled) return; const on = s.getAttribute('aria-checked') !== 'true'; s.setAttribute('aria-checked', on); if (fn) fn(s, on); }));
  },
  swOn(el) { return el && el.getAttribute('aria-checked') === 'true'; },

  /* ---------- pager (SPEC_v2 §6.4 footer) ---------- */
  pageNums(page, pages) {
    if (pages <= 7) return Array.from({ length: pages }, (_, i) => i + 1);
    const out = [1]; const a = Math.max(2, page - 1), z = Math.min(pages - 1, page + 1);
    if (a > 2) out.push('…'); for (let i = a; i <= z; i++) out.push(i); if (z < pages - 1) out.push('…'); out.push(pages); return out;
  },
  pager(r, unit, sizes) {
    unit = unit || '筆'; sizes = sizes || [20, 50, 100];
    const total = r.total || 0, page = r.page || 1, ps = r.pageSize || 50, pages = Math.max(1, r.pages || Math.ceil(total / ps) || 1);
    const a = total ? (page - 1) * ps + 1 : 0, z = Math.min(total, page * ps);
    return `<nav class="pager" data-pager="admin" aria-label="分頁"><span class="rng num">第 ${AUI.n(a)}–${AUI.n(z)} ${unit}／共 ${AUI.n(total)} ${unit}</span>
      <label class="psz">每頁<select class="ps num" data-ps aria-label="每頁筆數">${sizes.map(s => `<option value="${s}" ${s === ps ? 'selected' : ''}>${s} ${unit}</option>`).join('')}</select></label>
      <span class="pgs"><button class="pg" data-pg="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="上一頁">${ic('left')}</button>${AUI.pageNums(page, pages).map(n => n === '…' ? '<span class="gap">…</span>' : `<button class="pg ${n === page ? 'on' : ''}" data-pg="${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}<button class="pg" data-pg="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="下一頁">${ic('right')}</button></span></nav>`;
  },
  bindPager(root, onPage, onSize) {
    root.querySelectorAll('.pager [data-pg]').forEach(b => b.addEventListener('click', () => { if (!b.disabled) onPage(+b.dataset.pg); }));
    root.querySelectorAll('.pager [data-ps]').forEach(s => s.addEventListener('change', () => onSize(+s.value)));
  },

  /* ---------- popover / menu ---------- */
  closePops() { $$('.a-pop').forEach(m => m.remove()); },
  pop(anchor, html, bind, opt) {
    const was = anchor._pop && document.body.contains(anchor._pop); AUI.closePops(); if (was) { anchor._pop = null; return null; }
    const m = document.createElement('div'); m.className = 'a-pop ' + ((opt && opt.cls) || ''); m.innerHTML = html; document.body.appendChild(m); anchor._pop = m;
    const r = anchor.getBoundingClientRect(); const w = m.offsetWidth, h = m.offsetHeight;
    let left = (opt && opt.alignLeft) ? r.left : r.right - w; left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
    let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    m.style.left = left + 'px'; m.style.top = top + 'px';
    const close = e => { if (e && (m.contains(e.target) || anchor.contains(e.target))) return; m.remove(); anchor._pop = null; document.removeEventListener('mousedown', close); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') close(); };
    setTimeout(() => { document.addEventListener('mousedown', close); document.addEventListener('keydown', esc); }, 0);
    m.close = () => close();
    if (bind) bind(m);
    return m;
  },
  menu(anchor, items) {
    return AUI.pop(anchor, items.map((it, i) => it === '-' ? '<div class="sep"></div>' : `<button class="mi ${it.danger ? 'danger' : ''}" data-mi="${i}" ${it.disabled ? 'disabled' : ''}>${it.icon ? ic(it.icon) : ''}<span>${U.esc(it.label)}</span></button>`).join(''), m => {
      m.addEventListener('click', e => { const b = e.target.closest('[data-mi]'); if (!b || b.disabled) return; m.close(); items[+b.dataset.mi].onClick(); });
    }, { cls: 'menu' });
  },

  /* ---------- drawer (right panel desktop / bottom sheet phone) ---------- */
  closeDrawer() { $$('.dw-scrim').forEach(d => { d.classList.add('out'); setTimeout(() => d.remove(), 160); }); document.body.classList.remove('dw-open'); },
  drawer(html, bind, opt) {
    $$('.dw-scrim').forEach(d => d.remove());
    const sc = document.createElement('div'); sc.className = 'dw-scrim';
    sc.innerHTML = `<div class="dw ${(opt && opt.cls) || ''}" role="dialog" aria-modal="true" ${(opt && opt.label) ? `aria-label="${U.esc(opt.label)}"` : ''}>${html}</div>`;
    document.body.appendChild(sc); document.body.classList.add('dw-open');
    const kd = e => { if (e.key === 'Escape' && !$('.scrim:not(.dw-scrim)')) { AUI.closeDrawer(); document.removeEventListener('keydown', kd); } };
    document.addEventListener('keydown', kd);
    sc.addEventListener('mousedown', e => { if (e.target === sc) AUI.closeDrawer(); });
    sc.addEventListener('click', e => { if (e.target.closest('[data-dx]')) AUI.closeDrawer(); });
    if (bind) bind(sc.querySelector('.dw'));
    const f = sc.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 40);
    return sc.querySelector('.dw');
  },

  /* ---------- download ---------- */
  download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },

  /* ---------- pointer-event sortable (SPEC_v2 §6.6 `data-drag` handle) ----------
     container: element holding groups or items. opt = { item: '.sel', handle: '[data-drag]', groups: '.sel' (optional, items may move between),
     list: '.sel' inside a group that holds items, onEnd({el, from, to, order:[ids], fromOrder}) }   ids read from data-id */
  sortable(container, opt) {
    const handleSel = opt.handle || '[data-drag]';
    container.addEventListener('pointerdown', e => {
      const h = e.target.closest(handleSel); if (!h || !container.contains(h)) return;
      const el = h.closest(opt.item); if (!el || !container.contains(el)) return;
      if (opt.only && !opt.only(el)) return;
      e.preventDefault();
      const listOf = x => opt.list ? x.closest(opt.list) : x.parentElement;
      const from = listOf(el); const fromOrder = $$(':scope > ' + opt.item, from).map(x => x.dataset.id);
      const rect = el.getBoundingClientRect(); const dy = e.clientY - rect.top;
      const ghost = el.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.style.width = rect.width + 'px'; ghost.style.left = rect.left + 'px'; ghost.style.top = rect.top + 'px'; document.body.appendChild(ghost);
      el.classList.add('drag-src');
      const lists = () => opt.list ? $$(opt.list, container) : [from];
      const move = ev => {
        ghost.style.top = (ev.clientY - dy) + 'px';
        let target = null; lists().forEach(l => { const r = l.getBoundingClientRect(); if (ev.clientY >= r.top - 24 && ev.clientY <= r.bottom + 24 && ev.clientX >= r.left - 40 && ev.clientX <= r.right + 40) target = target || l; });
        if (!target) return;
        const sibs = $$(':scope > ' + opt.item, target).filter(x => x !== el);
        let before = null; for (const s of sibs) { const r = s.getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { before = s; break; } }
        if (before) target.insertBefore(el, before); else { const tail = opt.tail ? target.querySelector(':scope > ' + opt.tail) : null; target.insertBefore(el, tail); }
        const edge = 60; if (ev.clientY < edge) window.scrollBy(0, -12); else if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 12);
      };
      const up = () => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        ghost.remove(); el.classList.remove('drag-src');
        const to = listOf(el); const order = $$(':scope > ' + opt.item, to).map(x => x.dataset.id);
        if (to === from && order.join() === fromOrder.join()) return;
        opt.onEnd({ el, from, to, order, fromOrder: $$(':scope > ' + opt.item, from).map(x => x.dataset.id) });
      };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    /* keyboard: Alt+↑/↓ on a focused handle moves the item */
    container.addEventListener('keydown', e => {
      const h = e.target.closest(handleSel); if (!h || !(e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown'))) return;
      const el = h.closest(opt.item); const from = opt.list ? el.closest(opt.list) : el.parentElement; const fromOrder = $$(':scope > ' + opt.item, from).map(x => x.dataset.id);
      e.preventDefault(); const sib = e.key === 'ArrowUp' ? el.previousElementSibling : el.nextElementSibling; if (!sib || !sib.matches(opt.item)) return;
      if (e.key === 'ArrowUp') from.insertBefore(el, sib); else from.insertBefore(sib, el); h.focus();
      opt.onEnd({ el, from, to: from, order: $$(':scope > ' + opt.item, from).map(x => x.dataset.id), fromOrder });
    });
  },

  /* ---------- list editor (json arrays in content / quiz / plan details) ----------
     cols: [{k, type:'input'|'textarea'|'icon'|'bool', ph, max, flex}] ; rows: array of objects.
     returns html; AUI.listGet(root) reads it back. */
  ICONS: ['sprout', 'chat', 'doc', 'target', 'baby', 'plus', 'cal', 'person', 'clock', 'user-x', 'refund', 'heart', 'shield', 'star', 'moon', 'spark', 'video', 'coin', 'hands', 'bell'],
  listRow(cols, r, i) {
    return `<div class="le-row" data-id="r${i}"><button type="button" class="hd" data-drag aria-label="拖曳排序（Alt+方向鍵）">${ic('drag')}</button><div class="le-f">${cols.map(c => {
      const v = r[c.k] == null ? '' : r[c.k];
      if (c.type === 'icon') return `<button type="button" class="le-ic" data-lk="${c.k}" data-v="${U.esc(v || 'sprout')}" aria-label="選擇圖示">${ic(v || 'sprout')}</button>`;
      if (c.type === 'bool') return `<label class="le-b"><span>${U.esc(c.ph || '')}</span>${AUI.sw(!!v, `data-lk="${c.k}"`, c.ph)}</label>`;
      if (c.type === 'textarea') return `<textarea class="inp" data-lk="${c.k}" rows="2" ${c.max ? `maxlength="${c.max}"` : ''} placeholder="${U.esc(c.ph || '')}" style="flex:${c.flex || 2}">${U.esc(v)}</textarea>`;
      return `<input class="inp" data-lk="${c.k}" value="${U.esc(v)}" ${c.max ? `maxlength="${c.max}"` : ''} placeholder="${U.esc(c.ph || '')}" style="flex:${c.flex || 1}">`;
    }).join('')}</div><button type="button" class="x" data-lx aria-label="刪除此項">${ic('x')}</button></div>`;
  },
  list(id, cols, rows, opt) {
    opt = opt || {};
    return `<div class="le" data-le="${id}" data-max="${opt.max || 20}" ${opt.wrap ? 'data-wrap="1"' : ''}><div class="le-rows">${(rows || []).map((r, i) => AUI.listRow(cols, r, i)).join('')}</div>
      <button type="button" class="addrow" data-ladd>${ic('plus')}${U.esc(opt.addLabel || '新增項目')}</button></div>`;
  },
  bindList(root, id, cols, onChange) {
    const le = root.querySelector(`[data-le="${id}"]`); if (!le) return;
    const rowsEl = le.querySelector('.le-rows'); let seq = 1000;
    const fire = () => { AUI.listCount(le); if (onChange) onChange(AUI.listGet(le, cols)); };
    le.addEventListener('input', fire);
    le.addEventListener('click', e => {
      const x = e.target.closest('[data-lx]'); if (x) { x.closest('.le-row').remove(); fire(); return; }
      const sw = e.target.closest('.switch'); if (sw) { sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true'); fire(); return; }
      const icb = e.target.closest('.le-ic'); if (icb) {
        AUI.pop(icb, `<div class="icpick">${AUI.ICONS.map(n => `<button data-icn="${n}" class="${n === icb.dataset.v ? 'on' : ''}" aria-label="${n}">${ic(n)}</button>`).join('')}</div>`, m => m.addEventListener('click', ev => { const b = ev.target.closest('[data-icn]'); if (!b) return; icb.dataset.v = b.dataset.icn; icb.innerHTML = ic(b.dataset.icn); m.close(); fire(); }), { alignLeft: true });
        return;
      }
      if (e.target.closest('[data-ladd]')) {
        if (rowsEl.children.length >= +le.dataset.max) { toast(`最多 ${le.dataset.max} 項`, 'err'); return; }
        rowsEl.insertAdjacentHTML('beforeend', AUI.listRow(cols, {}, seq++)); const f = rowsEl.lastElementChild.querySelector('.inp'); if (f) f.focus(); fire();
      }
    });
    AUI.sortable(rowsEl, { item: '.le-row', onEnd: fire });
    AUI.listCount(le);
  },
  listCount(le) { const add = le.querySelector('[data-ladd]'); if (add) add.disabled = le.querySelector('.le-rows').children.length >= +le.dataset.max; },
  listGet(le, cols) {
    return $$('.le-row', le).map(row => { const o = {}; cols.forEach(c => { const el = row.querySelector(`[data-lk="${c.k}"]`); if (!el) return; o[c.k] = c.type === 'icon' ? el.dataset.v : c.type === 'bool' ? el.getAttribute('aria-checked') === 'true' : el.value.trim(); }); return o; })
      .filter(o => cols.some(c => c.type !== 'bool' && c.type !== 'icon' && o[c.k]));
  },

  /* ---------- small states ---------- */
  loading(root, title) { root.innerHTML = `<div class="a-load" aria-busy="true"><span class="skel" style="height:34px;width:200px"></span><span class="skel" style="height:120px"></span><span class="skel" style="height:320px"></span></div>`; },
  empty(txt, sub) { return `<div class="empty">${AUI.pl('pearl', 'em-pl')}<b>${U.esc(txt)}</b>${sub ? `<br><small>${sub}</small>` : ''}</div>`; },
  isoDate(ts) { return ts ? String(ts).slice(0, 10) : ''; }
};

  async route(h, root) {
    const path = AUI.path(); const sub = path[1] || '';
